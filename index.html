<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Inventario de Parqueo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --asphalt: #24272b;
    --asphalt-2: #2f3338;
    --asphalt-3: #3a3f45;
    --line: #f2c230;
    --line-dim: #b8912a;
    --paper: #f4f5f2;
    --ink: #1b1e21;
    --muted: #8b9198;
    --ok: #4caf7d;
    --danger: #d9553f;
    --z-avaluo: #4f8fd1;
    --z-atras: #5fb37a;
    --z-malla: #a175d4;
    --z-neon: #e0529c;
    --z-pge: #e2843a;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .plate{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  header{
    background: linear-gradient(180deg, var(--asphalt) 0%, var(--asphalt-2) 100%);
    color: var(--paper);
    padding: 18px 16px 14px;
    position: sticky; top:0; z-index: 20;
    border-bottom: 4px solid var(--line);
  }
  header .top-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  header h1{
    font-size: 1.15rem;
    margin:0;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  header h1 .dash{color:var(--line);}
  .meta{
    font-size: 0.72rem;
    color: var(--muted);
    margin-top:2px;
  }
  #exportBtn{
    background: var(--line);
    color: var(--asphalt);
    border:none;
    font-weight:700;
    padding: 6px 12px;
    border-radius: var(--radius);
    font-size: 0.74rem;
    cursor:pointer;
    white-space:nowrap;
  }
  #exportBtn:active{transform: translateY(1px);}
  .headerBtns{
    display:flex; flex-direction:column; gap:6px; align-items:stretch;
  }
  #undoBtn{
    background: transparent;
    color: var(--paper);
    border:1px solid var(--asphalt-3);
    font-weight:600;
    padding: 6px 14px;
    border-radius: var(--radius);
    font-size: 0.76rem;
    cursor:pointer;
    white-space:nowrap;
  }
  #undoBtn:disabled{
    opacity:0.35;
    cursor:default;
  }
  #undoBtn:not(:disabled):active{transform: translateY(1px);}
  .searchWrap{
    position:relative;
    margin-top:12px;
  }
  #globalSearch{
    width:100%;
    padding: 10px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--asphalt-3);
    background: var(--asphalt-2);
    color: var(--paper);
    font-size: 0.95rem;
  }
  #globalSearch::placeholder{color:var(--muted);}
  #globalSearch:focus{outline:2px solid var(--line);}
  #searchResults{
    position:absolute;
    left:0; right:0; top:calc(100% + 4px);
    background: var(--asphalt-2);
    border:1px solid var(--asphalt-3);
    border-radius: var(--radius);
    max-height: 260px;
    overflow-y:auto;
    z-index: 30;
    display:none;
  }
  #searchResults.show{display:block;}
  .searchItem{
    padding:9px 14px;
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer;
    border-bottom:1px solid var(--asphalt-3);
    color: var(--paper);
    font-size:0.9rem;
  }
  .searchItem:last-child{border-bottom:none;}
  .searchItem:hover{background:var(--asphalt-3);}
  .searchItem .tag{font-size:0.72rem; color: var(--muted);}
  nav#tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding: 12px 12px 0;
    background: var(--paper);
    position: sticky; top: 104px; z-index: 15;
    border-bottom: 1px solid #dfe0dc;
  }
  nav#tabs::-webkit-scrollbar{display:none;}
  .tabBtn{
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 999px 999px 0 0;
    border: none;
    background: #e6e7e2;
    color: var(--ink);
    font-weight:600;
    font-size: 0.82rem;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    margin-bottom:-1px;
  }
  .tabBtn .dot{width:8px;height:8px;border-radius:50%;}
  .tabBtn.active{
    background: var(--paper);
    border: 1px solid #dfe0dc;
    border-bottom: 3px solid var(--zone-color, var(--line));
  }
  .tabBtn .count{
    background: rgba(0,0,0,0.08);
    padding: 1px 6px;
    border-radius: 999px;
    font-size:0.72rem;
  }
  main{padding: 16px;}
  .zonePanel{display:none;}
  .zonePanel.active{display:block;}
  .zoneHeadCard{
    background:white;
    border-radius: var(--radius);
    padding:14px 16px;
    margin-bottom:14px;
    border-left: 6px solid var(--zone-color);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .zoneHeadCard h2{margin:0 0 2px; font-size:1rem;}
  .zoneHeadCard .sub{font-size:0.78rem; color:var(--muted);}
  .occupancyRow{
    display:flex; align-items:center; gap:8px;
    margin-top:8px;
  }
  .occupancyBar{
    flex:1;
    height:7px;
    border-radius:999px;
    background:#eceee9;
    overflow:hidden;
  }
  .occupancyBarFill{
    height:100%;
    border-radius:999px;
    background: var(--zone-color);
  }
  .occupancyText{
    font-size:0.74rem;
    color:var(--muted);
    white-space:nowrap;
  }
  .capacityEditBtn{
    background:none;
    border:none;
    color: var(--zone-color);
    font-size:0.74rem;
    font-weight:700;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
    white-space:nowrap;
  }
  .addRow{
    display:flex; gap:8px; margin-bottom:10px;
  }
  .addRow input.campoInput{
    width: 84px;
    flex: 0 0 auto;
  }
  .addRow input{
    padding:10px 12px;
    border-radius: var(--radius);
    border:1px solid #d7d8d3;
    font-size:0.95rem;
  }
  .addRow input.plateInputAdd{ flex:1; }
  .addRow button{
    background: var(--ink);
    color:white;
    border:none;
    border-radius: var(--radius);
    padding: 0 16px;
    font-weight:700;
    cursor:pointer;
    font-size:0.85rem;
  }
  .addRowSecondary{
    margin-bottom:8px;
  }
  .addRowSecondary input{
    width:100%;
    padding:8px 12px;
    border-radius: var(--radius);
    border:1px solid #e2e3de;
    background:#fbfbfa;
    font-size:0.85rem;
  }
  .addRowSecondary input:focus{
    outline:none;
    border-color: var(--line-dim);
    background:white;
  }
  .addHint{
    font-size:0.72rem;
    color:var(--muted);
    margin: -4px 0 12px;
  }
  .sinAsignarBtn{
    background:none;
    border:none;
    color: var(--zone-color, var(--line-dim));
    font-size:0.72rem;
    font-weight:700;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .dupWarn{
    display:flex;
    align-items:center;
    gap:6px;
    background:#fbeee0;
    color:#8a5a1c;
    border:1px solid #f0d5b3;
    border-radius:8px;
    padding:7px 10px;
    font-size:0.8rem;
    font-weight:600;
    margin: -4px 0 10px;
  }
  .dupWarn .dupWarnIcon{flex:0 0 auto; font-size:0.9rem;}
  details.bulk{
    margin-bottom:14px;
  }
  details.bulk summary{
    cursor:pointer; font-size:0.82rem; color:var(--muted); font-weight:600;
    padding: 6px 0;
  }
  details.bulk .bulkHint{
    font-size:0.76rem; color:var(--muted); margin: 2px 0 6px;
  }
  details.bulk textarea{
    width:100%;
    min-height:80px;
    border-radius: var(--radius);
    border:1px solid #d7d8d3;
    padding:10px 12px;
    font-family: ui-monospace, monospace;
    font-size:0.85rem;
    resize:vertical;
  }
  details.bulk .bulkBtn{
    margin-top:6px;
    background: var(--zone-color);
    color:white;
    border:none;
    padding:8px 14px;
    border-radius: var(--radius);
    font-weight:700;
    cursor:pointer;
    font-size:0.82rem;
  }
  .campoList{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .campoCard{
    background:white;
    border-radius: var(--radius);
    padding: 10px 12px;
    display:flex;
    align-items:flex-start;
    gap:10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .campoNum{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:38px;
    height:26px;
    padding:0 8px;
    border-radius:6px;
    background: var(--zone-color);
    color:white;
    font-weight:800;
    font-size:0.78rem;
    flex: 0 0 auto;
    margin-top:2px;
  }
  .campoBody{flex:1; min-width:0;}
  .plateChips{
    display:flex; flex-wrap:wrap; gap:6px;
    align-items:flex-start;
  }
  .plateChip{
    display:flex; flex-direction:column;
    background:#eceee9;
    border-radius: 7px;
    padding: 5px 4px 6px 10px;
    font-size:0.85rem;
    cursor:pointer;
  }
  .plateChip:active{background:#e0e1dc;}
  .plateChipMain{
    display:flex; align-items:center; gap:6px;
  }
  .plateChip .plateText{
    min-width: 70px;
    outline:none;
  }
  .plateChip .plateText:focus{background:white; border-radius:4px; padding:0 3px;}
  .aseguradoraText{
    outline:none;
    font-size:0.68rem;
    color:var(--muted);
    font-weight:600;
    margin-top:2px;
    padding-left:2px;
    min-width:60px;
  }
  .aseguradoraText:empty::before{
    content: attr(data-placeholder);
    color:#b4b6b0;
    font-weight:500;
  }
  .aseguradoraText:focus{background:white; border-radius:4px; padding:2px 3px; color:var(--ink);}
  .orderBadge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:16px;
    height:16px;
    border-radius:50%;
    background:#d8d9d4;
    color:#5a5d61;
    font-size:0.62rem;
    font-weight:800;
    padding:0 3px;
  }
  .orderTag{
    font-size:0.62rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--muted);
    background:#e0e1dc;
    border-radius:5px;
    padding:2px 5px;
  }
  .orderTag.last{
    color:var(--asphalt);
    background: var(--line);
  }
  .campoNum{
    cursor:pointer;
  }
  .campoNum:active{opacity:0.8;}
  .campoNum.sinAsignar{
    background:transparent;
    border:1.5px dashed #b4b6b0;
    color:#6b6e72;
    font-weight:700;
    font-size:0.7rem;
  }
  .plateChip .chipRm{
    background:none; border:none; color:var(--danger);
    cursor:pointer; font-size:0.95rem; padding:2px 6px; line-height:1;
  }
  .orderMoveBtns{
    display:flex; flex-direction:column;
    line-height:0;
  }
  .orderMoveBtns button{
    background:none; border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:0.6rem;
    padding:1px 3px;
    line-height:1;
  }
  .orderMoveBtns button:disabled{
    opacity:0.25;
    cursor:default;
  }
  .orderMoveBtns button:not(:disabled):active{color:var(--ink);}
  .addPlateToCampoBtn{
    background:none;
    border:1px dashed #c7c8c2;
    color:var(--muted);
    border-radius:7px;
    padding:5px 10px;
    font-size:0.8rem;
    cursor:pointer;
  }
  .campoDeleteBtn{
    background:none; border:none; color:var(--muted);
    cursor:pointer; font-size:1rem; padding:4px 6px; flex:0 0 auto;
  }
  .emptyState{
    text-align:center;
    color:var(--muted);
    padding: 30px 10px;
    font-size:0.85rem;
  }
  /* Resumen tab */
  .resumenToolbar{
    display:flex; gap:10px; margin-bottom:8px; flex-wrap:wrap;
    align-items:center;
    background:white;
    border-radius: var(--radius);
    padding:12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    border:1px solid #eceee9;
  }
  .filterField{
    position:relative;
    flex:1;
    min-width:170px;
  }
  .filterField .filterIcon{
    position:absolute;
    left:11px; top:50%; transform:translateY(-50%);
    width:15px; height:15px;
    color:var(--muted);
    pointer-events:none;
  }
  .resumenToolbar input{
    width:100%;
    padding:9px 12px 9px 34px;
    border-radius:8px;
    border:1px solid #d7d8d3;
    background:#fbfbfa;
    font-size:0.9rem;
    transition: border-color 0.15s, background 0.15s;
  }
  .resumenToolbar input:focus{
    outline:none;
    border-color: var(--line-dim);
    background:white;
  }
  .selectField{ flex: 0 1 190px; min-width:150px; }
  .resumenToolbar select{
    width:100%;
    padding:9px 30px 9px 12px;
    border-radius:8px;
    border:1px solid #d7d8d3;
    background:#fbfbfa;
    font-size:0.9rem;
    appearance:none;
    -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%238b9198'><path d='M5.5 7.5l4.5 5 4.5-5z'/></svg>");
    background-repeat:no-repeat;
    background-position: right 8px center;
    background-size:16px;
    cursor:pointer;
  }
  .resumenToolbar select:focus{
    outline:none;
    border-color: var(--line-dim);
    background-color:white;
  }
  .clearFilterBtn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:0.78rem;
    font-weight:600;
    text-decoration:underline;
    cursor:pointer;
    padding:6px 2px;
    white-space:nowrap;
  }
  .resultsCount{
    font-size:0.74rem;
    color:var(--muted);
    margin: 0 2px 12px;
  }
  .zoneChips{
    display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;
  }
  .chip{
    display:flex; align-items:center; gap:6px;
    padding:5px 10px;
    border-radius:999px;
    background:white;
    font-size:0.75rem;
    font-weight:600;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;}
  table{
    width:100%;
    border-collapse: collapse;
    background:white;
    border-radius: var(--radius);
    overflow:hidden;
  }
  thead th{
    text-align:left;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color: var(--muted);
    padding:8px 10px;
    border-bottom:2px solid #eceee9;
  }
  tbody td{
    padding:9px 10px;
    border-bottom:1px solid #f0f1ed;
    font-size:0.92rem;
    vertical-align:top;
  }
  tbody tr:last-child td{border-bottom:none;}
  .resumenRow{cursor:pointer;}
  .resumenRow:active{background:#f0f1ed;}
  .spotNum{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:30px;
    height:22px;
    padding:0 6px;
    border-radius:6px;
    color:white;
    font-weight:700;
    font-size:0.72rem;
  }
  .spotNum.sinAsignar{
    background:transparent !important;
    border:1.5px dashed #b4b6b0;
    color:#6b6e72;
  }
  .toast{
    position:fixed;
    bottom:16px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background: var(--ink);
    color:white;
    padding:10px 18px;
    border-radius: 14px;
    font-size:0.8rem;
    max-width: min(90vw, 420px);
    text-align:center;
    line-height:1.4;
    opacity:0;
    transition: all 0.25s ease;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .modalOverlay{
    position:fixed; inset:0;
    background: rgba(27,30,33,0.55);
    display:none;
    align-items:center; justify-content:center;
    z-index:60;
    padding:20px;
  }
  .modalOverlay.show{display:flex;}
  .modalCard{
    background:white;
    border-radius: 14px;
    max-width: 360px;
    width:100%;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .modalCard h3{margin:0 0 8px; font-size:1rem;}
  .modalCard p{margin:0 0 16px; font-size:0.88rem; color:var(--muted); line-height:1.4;}
  .modalCard .modalActions{display:flex; gap:8px; flex-direction:column;}
  .modalCard button{
    border:none; border-radius: var(--radius);
    padding:11px 14px; font-weight:700; font-size:0.88rem; cursor:pointer;
  }
  .modalCard .primaryBtn{background: var(--ink); color:white;}
  .modalCard .secondaryBtn{background:#eceee9; color:var(--ink);}
  .modalCard .dangerBtn{background:none; color:var(--danger); text-decoration:underline; padding:8px 0;}
  .modalCard label{
    display:block; font-size:0.76rem; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.03em; margin: 12px 0 4px;
  }
  .modalCard select, .modalCard input[type=text]{
    width:100%;
    padding:10px 12px;
    border-radius: var(--radius);
    border:1px solid #d7d8d3;
    font-size:0.95rem;
  }
  @media (max-width:480px){
    header h1{font-size:1rem;}
  }
  .authGate{
    position:fixed; inset:0;
    background: linear-gradient(180deg, var(--asphalt) 0%, var(--asphalt-2) 100%);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    padding:20px;
  }
  .authCard{
    background:white;
    border-radius:14px;
    max-width:360px;
    width:100%;
    padding:28px 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .authTitle{
    font-size:1.15rem;
    font-weight:800;
    margin:0 0 4px;
    color:var(--ink);
  }
  .authTitle .dash{color:var(--line-dim);}
  .authSub{
    font-size:0.82rem;
    color:var(--muted);
    margin:0 0 16px;
    line-height:1.4;
  }
  .authGate label{
    display:block; font-size:0.76rem; font-weight:700; color:var(--muted);
    text-transform:uppercase; letter-spacing:0.03em; margin: 12px 0 4px;
  }
  .authGate input{
    width:100%;
    padding:10px 12px;
    border-radius: var(--radius);
    border:1px solid #d7d8d3;
    font-size:0.95rem;
  }
  .authBtn{ width:100%; margin-top:18px; padding:11px 14px; }
  .authError{
    color:var(--danger);
    font-size:0.78rem;
    font-weight:600;
    margin: 10px 0 0;
    min-height:0;
  }
  .authError:empty{ margin:0; }
  #authChecking{ display:none; }
  .userChip{
    color: var(--paper);
    font-size:0.76rem;
    font-weight:600;
    display:flex;
    align-items:center;
    padding: 0 2px;
    white-space:nowrap;
  }
  #usersBtn{
    background: transparent;
    color: var(--paper);
    border:1px solid var(--asphalt-3);
    font-weight:600;
    padding: 6px 14px;
    border-radius: var(--radius);
    font-size: 0.76rem;
    cursor:pointer;
    white-space:nowrap;
  }
  .usersList{
    display:flex; flex-direction:column; gap:6px;
    max-height:200px; overflow-y:auto;
  }
  .userRow{
    display:flex; align-items:center; justify-content:space-between;
    background:#f4f5f2; border-radius:8px; padding:8px 10px;
    font-size:0.85rem;
  }
  .userRow .userRowName{ font-weight:600; }
  .userRow .userRowMe{ color:var(--muted); font-size:0.72rem; font-weight:500; }
  .userRow button{
    background:none; border:none; color:var(--danger);
    cursor:pointer; font-size:0.78rem; font-weight:600;
  }
</style>
</head>
<body>

<div class="authGate" id="authGate">
  <div class="authCard">
    <h1 class="authTitle">Inventario <span class="dash">·</span> Parqueo</h1>

    <div id="authSetup" style="display:none;">
      <p class="authSub">No hay usuarios configurados todavía. Creá la primera cuenta para empezar.</p>
      <label for="setupUser">Usuario</label>
      <input type="text" id="setupUser" autocomplete="username">
      <label for="setupPass">Contraseña</label>
      <input type="password" id="setupPass" autocomplete="new-password">
      <label for="setupPass2">Confirmar contraseña</label>
      <input type="password" id="setupPass2" autocomplete="new-password">
      <p class="authError" id="setupError"></p>
      <button class="primaryBtn authBtn" id="setupBtn">Crear cuenta</button>
    </div>

<script>
(function(){

  const ZONES = [
    { key: "Avaluo", label: "Avalúo", abbr: "AV", color: "var(--z-avaluo)", hex: "4F8FD1" },
    { key: "Atras", label: "Atrás", abbr: "AT", color: "var(--z-atras)", hex: "5FB37A" },
    { key: "Malla", label: "Malla", abbr: "ML", color: "var(--z-malla)", hex: "A175D4" },
    { key: "Neon Nieto", label: "Neon Nieto", abbr: "NN", color: "var(--z-neon)", hex: "E0529C" },
    { key: "Parqueo Gash Externo", label: "Parqueo Gash Externo", abbr: "PGE", color: "var(--z-pge)", hex: "E2843A" }
  ];

  // Semilla: campo (columna/posición real del Excel) -> lista de placas en ese campo
  const SEED_DATA = {"Avaluo": {"1": ["CL338850", "BRT285"], "2": ["FBJ328"], "3": ["BZL006", "AGV9124"], "4": ["CL323859", "BVW241", "ABJ612"], "5": ["BXN690", "CBX388"], "6": ["PE000330", "BYS474"], "7": ["3494", "BWR660"], "8": ["Cl379044", "Prado blanco", "cbk888"], "9": ["Cl307033", "Cl534001", "mkv090"], "10": ["C174570", "bwc311"], "11": ["Cl497008", "Acc081", "Abq540"], "12": ["BJR486", "Aak047"], "13": ["kph192", "Mpg156", "Cl371394"], "14": ["Bsx981", "Cl325517", "MYM683"], "15": ["Tacoma gris", "BWH531"], "16": ["Toyota cross blanco", "881301"], "17": ["FSC307", "BTS859", "Rxj668"], "18": ["Cl481636", "ACY439"], "19": ["Ste108", "Bsv193"], "20": ["Gsp100"], "21": ["Raptor blanco", "Bwc095"], "22": ["BYD323", "BWW252"], "23": ["MRm888", "Krn999"], "24": ["MPR299"], "25": ["Fede"], "27": ["BRF346"], "30": ["CL358702"], "31": ["CL367086", "ADM978"], "33": ["Cl319435"], "34": ["MHV018", "ccn680"], "35": ["Ccg040", "Brb334"], "36": ["Cbg019"], "37": ["GNZ212", "CL775954", "Lnx772"], "38": ["Hmr826"]}, "Atras": {"1": ["CL790798", "ADL148"], "2": ["AAA758", "FSD538"], "3": ["ABL259", "BXB968", "MPZ017"], "4": ["ACF765"], "5": ["BXM699", "FRD026", "MIQ718"], "6": ["CCF126", "BPL587", "NXH359"], "7": ["CL788404"], "8": ["CBD113", "CCH330", "BGJ960"], "9": ["CL357110", "AAM264", "AAH587"], "10": ["Ford-AGV215", "DRY100", "BVY106"], "11": ["GMK430", "ABF372", "FRS091"], "12": ["CROSSBLANCO", "BXJ037", "CL345354"], "13": ["FMD168", "301-000487", "RV4-Agv355"], "14": ["CL352560", "LSZ923", "CBV769"], "15": ["CBS904"], "16": ["BGH379"], "17": ["EAQ028", "PRADOBRONCE"], "18": ["BRT639", "CBL919"], "19": ["CCH663", "CD5718"], "20": ["CBM411", "CCJ147", "BZB750"], "21": ["KTJ929", "AAQ007", "CL357983"], "22": ["CL351523", "MTW019", "VNT028"], "23": ["ACE318", "CBD698", "RVT847"], "24": ["4RUNNERGRIS", "BXW488", "ABJ630"], "25": ["AAN112", "BVX068", "BWQ949"], "26": ["PSB176", "BXY408", "BYK739"], "27": ["CL347413", "BSW458"], "28": ["BXM221", "BWY262", "RBK512"], "29": ["WFQ168", "JPV451", "AAZ775"], "30": ["ABV667"], "33": ["CBZ669", "CL359800", "RVC429"], "34": ["CL347474", "2558", "GKM521"], "35": ["CMM291", "BXZ260"], "36": ["CRC1594", "CL375840", "ABE829", "4Runnerblanca"]}, "Malla": {"SN2": ["CL347468"], "SN3": ["BXL048"], "SN4": ["AAG828", "SM8253"], "SN5": ["AAA672", "PE6-1409"], "SN6": ["ambulancia 0003247"], "SN7": ["BYC412", "BWK142"], "SN9": ["AAG998"], "SN10": ["CBR906"], "SN11": ["AAC559"], "SN12": ["BVZ663"], "66": ["BWB803"], "67": ["BZQ358"], "68": ["BSF310"], "69": ["ABQ118"], "70": ["BQZ676"], "71": ["Cbp169"], "72": ["Raptorblanco"], "73": ["CCL699"], "74": ["YYJ192"], "75": ["BXD917"], "76": ["FAN210"], "1": ["ADp327"], "2": ["Toyota cross/Blanco"], "3": ["BWZ304"], "4": ["MEB007"], "5": ["Fjs248"], "6": ["BWy867"], "7": ["Bwl929"], "8": ["Yariscrossgris/AGv"], "9": ["Ccb551"], "10": ["Gxg097"], "11": ["Cl285553"], "12": ["Cl318237"], "13": ["Qyq511"], "14": ["Clg555"], "15": ["Bxk510"], "16": ["Cl809024"], "17": ["LCY210"], "18": ["AAM260"], "19": ["AAA757"]}, "Neon Nieto": {"8": ["LVD213"], "9": ["BXQ950"], "12": ["JRN010"], "13": ["CL368974"], "14": ["LNX095"], "15": ["BYN180"], "16": ["BLJ217"], "17": ["Raptor azul"], "19": ["PE17 328"]}, "Parqueo Gash Externo": {"1": ["BYB182"], "2": ["BZT815", "BYS479"], "5": ["BQC463"], "6": ["881301", "BRY000"], "7": ["RBK512"], "8": ["ACF277"], "10": ["ABQ926"], "11": ["WTF916"], "12": ["BJK099"], "13": ["BBP042", "BYS802"], "14": ["BKS153"], "15": ["CL337788", "BZJ669"], "16": ["CMM914", "CBS242"], "17": ["BJR852"], "18": ["BFB581", "GJR127"], "19": ["CAJON", "CL284691"], "20": ["DKD581"], "21": ["BTN258"], "23": ["CL534317", "BVP908"], "24": ["ABP277"], "25": ["CCG417"], "26": ["LSH115", "AAH079"], "27": ["ABR935"], "28": ["Carroceria"], "29": ["LYL015"]}};

  const STORAGE_KEY = "inventario_parqueo_v4";
  const LEGACY_CAMPOS_KEY = "inventario_parqueo_v3"; // versión anterior (campos con placas como texto simple)
  const LEGACY_FLAT_KEY = "inventario_parqueo_v1"; // versión anterior (lista plana)
  const USERS_KEY = "inventario_parqueo_users_v1";
  const SESSION_KEY = "inventario_parqueo_session_v1"; // guardado personal (por navegador), solo el nombre de usuario
  let state = null; // { zones: { zoneKey: [ {campo, plates:[]}, ... ] }, capacities:{zoneKey:number}, updatedAt }
  let activeTab = ZONES[0].key;
  let storageAvailable = true;
  let storageWarned = false;
  let pendingResumenFilter = ""; // texto a precargar en el filtro del Resumen al saltar ahí desde la búsqueda
  const undoStack = []; // snapshots de state.zones (deep clone), máx 10
  const UNDO_LIMIT = 10;

  function snapshotZones(){
    return JSON.parse(JSON.stringify(state.zones));
  }
  function pushUndo(snapshot){
    undoStack.push(snapshot);
    if(undoStack.length > UNDO_LIMIT) undoStack.shift();
    updateUndoBtn();
  }
  function updateUndoBtn(){
    const btn = document.getElementById("undoBtn");
    if(btn) btn.disabled = undoStack.length === 0;
  }
  async function doUndo(){
    if(undoStack.length === 0) return;
    const prev = undoStack.pop();
    state.zones = prev;
    updateUndoBtn();
    await saveState(true);
    renderAll();
    showToast("Cambio deshecho");
  }

  function zoneInfo(key){ return ZONES.find(z => z.key === key); }
  function normalizePlate(v){ return String(v).trim().toUpperCase(); }
  function normalizeCampo(v){ return String(v).trim(); }

  const SIN_ASIGNAR = "Sin asignar";

  function campoSortValue(c){
    const n = parseFloat(c);
    return isNaN(n) ? Infinity : n;
  }
  function sortCampos(arr){
    arr.sort((a,b)=>{
      if(a.campo === SIN_ASIGNAR && b.campo !== SIN_ASIGNAR) return 1;
      if(b.campo === SIN_ASIGNAR && a.campo !== SIN_ASIGNAR) return -1;
      const av = campoSortValue(a.campo), bv = campoSortValue(b.campo);
      if(av !== bv) return av - bv;
      return String(a.campo).localeCompare(String(b.campo));
    });
  }

  function seedZonesFromScratch(){
    const zones = {};
    ZONES.forEach(z=>{
      const src = SEED_DATA[z.key] || {};
      const arr = Object.keys(src).map(campo => ({
        campo,
        plates: src[campo].map(p => ({ plate: p, aseguradora: "" }))
      }));
      sortCampos(arr);
      zones[z.key] = arr;
    });
    return zones;
  }

  // Convierte el formato plano de la versión anterior (lista de placas por
  // zona) al modelo de campos, asignando un campo secuencial a cada placa.
  function migrateFlatToCampos(flatZones){
    const zones = {};
    ZONES.forEach(z=>{
      const list = flatZones[z.key] || [];
      zones[z.key] = list.map((plate, idx) => ({ campo: String(idx+1), plates: [{ plate, aseguradora: "" }] }));
    });
    return zones;
  }

  // Convierte campos cuyas placas todavía sean strings (formato v3, sin
  // aseguradora) al modelo de objetos {plate, aseguradora}.
  function migrateCamposToPlateObjects(zones){
    ZONES.forEach(z=>{
      const arr = zones[z.key] || [];
      arr.forEach(c=>{
        c.plates = (c.plates || []).map(p => (typeof p === "string") ? { plate: p, aseguradora: "" } : p);
      });
    });
    return zones;
  }

  function showToast(msg, duration){
    const t = document.getElementById("toast");
    t.textContent = msg || "Guardado";
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> t.classList.remove("show"), duration || 1600);
  }

  function showStorageBanner(){
    if(document.getElementById("storageBanner")) return;
    const b = document.createElement("div");
    b.id = "storageBanner";
    b.style.cssText = "background:#3a2a12;color:#f2c230;font-size:0.78rem;padding:8px 16px;text-align:center;";
    b.textContent = "No se pudo activar el guardado automático en este navegador — los cambios se mantienen mientras la pestaña esté abierta. Exportá a Excel antes de cerrar para no perder nada.";
    document.body.insertBefore(b, document.querySelector("nav#tabs"));
  }

  async function checkStorageAvailable(){
    if(!window.storage || typeof window.storage.set !== "function" || typeof window.storage.get !== "function"){
      return false;
    }
    try{
      const probe = await window.storage.set("__probe__", "1", true);
      if(!probe || typeof probe !== "object") return false;
      return true;
    }catch(e){
      return false;
    }
  }

  async function loadState(){
    storageAvailable = await checkStorageAvailable();

    if(storageAvailable){
      // 1) dato compartido ya en el formato actual (v4, con aseguradora)
      try{
        const shared = await window.storage.get(STORAGE_KEY, true);
        if(shared && shared.value){
          state = JSON.parse(shared.value);
          if(!state.capacities) state.capacities = {};
          return;
        }
      }catch(e){ /* no existe todavía */ }

      // 1b) versión anterior (v3: campos con placas como texto simple, sin aseguradora) -> migrar
      try{
        const legacyCampos = await window.storage.get(LEGACY_CAMPOS_KEY, true);
        if(legacyCampos && legacyCampos.value){
          const old = JSON.parse(legacyCampos.value);
          state = {
            zones: migrateCamposToPlateObjects(old.zones || {}),
            capacities: old.capacities || {},
            updatedAt: new Date().toISOString()
          };
          await saveState(true);
          return;
        }
      }catch(e){ /* nada */ }

      // 2) versión anterior (lista plana) guardada como compartida -> migrar
      try{
        const legacyShared = await window.storage.get(LEGACY_FLAT_KEY, true);
        if(legacyShared && legacyShared.value){
          const old = JSON.parse(legacyShared.value);
          state = { zones: migrateFlatToCampos(old.zones || {}), capacities: {}, updatedAt: new Date().toISOString() };
          await saveState(true);
          return;
        }
      }catch(e){ /* nada */ }

      // 3) versión anterior guardada en modo personal -> migrar también
      try{
        const legacyPersonal = await window.storage.get(LEGACY_FLAT_KEY, false);
        if(legacyPersonal && legacyPersonal.value){
          const old = JSON.parse(legacyPersonal.value);
          state = { zones: migrateFlatToCampos(old.zones || {}), capacities: {}, updatedAt: new Date().toISOString() };
          await saveState(true);
          return;
        }
      }catch(e){ /* nada */ }
    }

    // primera vez, o sin almacenamiento disponible: sembrar con los datos reales del Excel
    state = { zones: seedZonesFromScratch(), capacities: {}, updatedAt: new Date().toISOString() };
    await saveState(true);
  }

  async function saveState(silent){
    state.updatedAt = new Date().toISOString();

    if(!storageAvailable){
      if(!storageWarned){ storageWarned = true; showStorageBanner(); }
      renderMeta();
      return;
    }

    try{
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
      if(!result || typeof result !== "object"){
        throw new Error("Unexpected response type");
      }
      if(!silent) showToast("Guardado");
    }catch(e){
      console.error("Error guardando", e);
      storageAvailable = false;
      if(!storageWarned){ storageWarned = true; showStorageBanner(); }
    }
    renderMeta();
  }

  function renderMeta(){
    let totalVeh = 0, totalCampos = 0;
    ZONES.forEach(z=>{
      const arr = state.zones[z.key] || [];
      totalCampos += arr.length;
      arr.forEach(c => totalVeh += c.plates.length);
    });
    const d = new Date(state.updatedAt);
    const fecha = d.toLocaleDateString("es-CR", {day:"2-digit", month:"short", year:"numeric"});
    const hora = d.toLocaleTimeString("es-CR", {hour:"2-digit", minute:"2-digit"});
    document.getElementById("metaLine").textContent = `${totalVeh} vehículos en ${totalCampos} campos · actualizado ${fecha}, ${hora}`;
  }

  function renderTabs(){
    const nav = document.getElementById("tabs");
    nav.innerHTML = "";
    ZONES.forEach(z=>{
      const btn = document.createElement("button");
      btn.className = "tabBtn" + (activeTab===z.key ? " active" : "");
      btn.style.setProperty("--zone-color", z.color);
      const count = (state.zones[z.key]||[]).reduce((a,c)=>a+c.plates.length,0);
      btn.innerHTML = `<span class="dot" style="background:${z.color}"></span> ${z.label} <span class="count">${count}</span>`;
      btn.onclick = ()=>{ activeTab = z.key; renderAll(); };
      nav.appendChild(btn);
    });
    const btn = document.createElement("button");
    btn.className = "tabBtn" + (activeTab==="__resumen__" ? " active" : "");
    btn.style.setProperty("--zone-color", "var(--line-dim)");
    const totalCount = ZONES.reduce((a,z)=>a + (state.zones[z.key]||[]).reduce((aa,c)=>aa+c.plates.length,0), 0);
    btn.innerHTML = `Resumen general <span class="count">${totalCount}</span>`;
    btn.onclick = ()=>{ activeTab = "__resumen__"; renderAll(); };
    nav.appendChild(btn);
  }

  function escapeAttr(s){
    return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  }
  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // Busca una placa en todas las zonas/campos. Devuelve {zoneKey, campoIdx, plateIdx} o null.
  function findPlate(plateUpper, excludeZone, excludeCampoIdx, excludePlateIdx){
    for(const z of ZONES){
      const arr = state.zones[z.key] || [];
      for(let ci=0; ci<arr.length; ci++){
        const plates = arr[ci].plates;
        for(let pi=0; pi<plates.length; pi++){
          if(z.key===excludeZone && ci===excludeCampoIdx && pi===excludePlateIdx) continue;
          if((plates[pi].plate||"").toUpperCase() === plateUpper){
            return { zoneKey: z.key, campoIdx: ci, plateIdx: pi };
          }
        }
      }
    }
    return null;
  }

  function askMoveOrCancel(plate, fromZoneLabel, fromCampo, toZoneLabel, toCampo){
    return new Promise((resolve)=>{
      const overlay = document.getElementById("dupModal");
      const msg = document.getElementById("dupModalMsg");
      msg.textContent = `${plate} ya está registrada en ${fromZoneLabel}, campo ${fromCampo}. ¿Se movió a ${toZoneLabel} (campo ${toCampo}), o fue un error al escribir la placa?`;
      overlay.classList.add("show");
      const moveBtn = document.getElementById("dupModalMove");
      const cancelBtn = document.getElementById("dupModalCancel");
      function cleanup(result){
        overlay.classList.remove("show");
        moveBtn.removeEventListener("click", onMove);
        cancelBtn.removeEventListener("click", onCancel);
        resolve(result);
      }
      function onMove(){ cleanup("move"); }
      function onCancel(){ cleanup("cancel"); }
      moveBtn.addEventListener("click", onMove);
      cancelBtn.addEventListener("click", onCancel);
    });
  }

  // Quita una placa de donde esté (por índice) y limpia el campo si queda vacío.
  function removePlateAt(zoneKey, campoIdx, plateIdx){
    const arr = state.zones[zoneKey];
    arr[campoIdx].plates.splice(plateIdx, 1);
    if(arr[campoIdx].plates.length === 0){
      arr.splice(campoIdx, 1);
    }
  }

  // Modal para editar la zona y el campo donde está una placa, abierto
  // desde una fila del Resumen (filtro por placa).
  // Quita una entrada de placa por identidad de objeto (evita bugs de
  // índices desfasados cuando se remueven dos placas en la misma operación).
  function removePlateEntryByRef(zoneKey, campoObj, entryObj){
    const idx = campoObj.plates.indexOf(entryObj);
    if(idx === -1) return;
    campoObj.plates.splice(idx, 1);
    if(campoObj.plates.length === 0){
      const arr = state.zones[zoneKey];
      const cIdx = arr.indexOf(campoObj);
      if(cIdx !== -1) arr.splice(cIdx, 1);
    }
  }

  function openEditLocModal(zoneKey, ci, pi){
    const arr = state.zones[zoneKey];
    if(!arr || !arr[ci] || pi >= arr[ci].plates.length){
      showToast("Esa placa ya cambió de lugar, actualizá la búsqueda");
      return;
    }
    const targetCampoObj = arr[ci];
    const targetEntry = targetCampoObj.plates[pi];
    const plate = targetEntry.plate;
    const currentCampo = targetCampoObj.campo;

    const overlay = document.getElementById("editLocModal");
    const sub = document.getElementById("editLocSub");
    const placaInput = document.getElementById("editLocPlaca");
    const zoneSelect = document.getElementById("editLocZone");
    const campoInput = document.getElementById("editLocCampo");
    const aseguradoraInput = document.getElementById("editLocAseguradora");
    const saveBtn = document.getElementById("editLocSave");
    const cancelBtn = document.getElementById("editLocCancel");
    const deleteBtn = document.getElementById("editLocDelete");
    const sinAsignarBtn = document.getElementById("editLocSinAsignarBtn");

    sub.textContent = `Actualmente en ${zoneInfo(zoneKey).label}, campo ${currentCampo}`;
    placaInput.value = plate;
    zoneSelect.innerHTML = ZONES.map(z=>`<option value="${z.key}" ${z.key===zoneKey?"selected":""}>${z.label}</option>`).join("");
    campoInput.value = currentCampo;
    aseguradoraInput.value = targetEntry.aseguradora || "";

    overlay.classList.add("show");

    function cleanup(){
      overlay.classList.remove("show");
      saveBtn.removeEventListener("click", onSave);
      cancelBtn.removeEventListener("click", onCancel);
      deleteBtn.removeEventListener("click", onDelete);
      sinAsignarBtn.removeEventListener("click", onSinAsignar);
    }
    function onCancel(){ cleanup(); }
    function onSinAsignar(){ campoInput.value = SIN_ASIGNAR; campoInput.focus(); }
    async function onSave(){
      const newZone = zoneSelect.value;
      const newCampo = normalizeCampo(campoInput.value);
      const newPlate = normalizePlate(placaInput.value);
      const newAseguradora = aseguradoraInput.value.trim();
      if(!newCampo){ showToast("Ingresá un campo válido"); return; }
      if(!newPlate){ showToast("Ingresá una placa válida"); return; }

      const sameLocation = (newZone === zoneKey && newCampo === currentCampo);
      const samePlate = (newPlate === normalizePlate(plate));

      // Caso simple: no cambia ni la ubicación ni la placa -> solo actualizar
      // la aseguradora en el mismo lugar, sin tocar el orden de llegada.
      if(sameLocation && samePlate){
        if(newAseguradora === (targetEntry.aseguradora || "")){ cleanup(); return; }
        const snap = snapshotZones();
        targetEntry.aseguradora = newAseguradora;
        pushUndo(snap);
        cleanup();
        await saveState();
        renderAll();
        return;
      }

      // Si la placa cambió (o se mueve), verificar que no choque con otra
      // placa existente en cualquier otro lugar del inventario.
      if(!samePlate){
        const dup = findPlate(newPlate, zoneKey, ci, pi);
        if(dup){
          const dupInfo = zoneInfo(dup.zoneKey);
          const dupCampoObj = state.zones[dup.zoneKey][dup.campoIdx];
          const dupEntry = dupCampoObj.plates[dup.plateIdx];
          const choice = await askMoveOrCancel(newPlate, dupInfo.label, dupCampoObj.campo, zoneInfo(newZone).label, newCampo);
          if(choice !== "move") return;
          const snap = snapshotZones();
          removePlateEntryByRef(dup.zoneKey, dupCampoObj, dupEntry);
          removePlateEntryByRef(zoneKey, targetCampoObj, targetEntry);
          getOrCreateCampo(newZone, newCampo).plates.push({ plate: newPlate, aseguradora: newAseguradora });
          pushUndo(snap);
          cleanup();
          await saveState();
          pendingResumenFilter = newPlate;
          renderAll();
          return;
        }
      } else if(!sameLocation) {
        // misma placa, solo cambia de ubicación: verificar que el destino
        // no tenga ya esta placa (caso raro, por seguridad).
        const destArr = state.zones[newZone];
        const destCampo = destArr.find(c => c.campo === newCampo);
        if(destCampo && destCampo.plates.some(p => p.plate.toUpperCase() === newPlate.toUpperCase())){
          showToast(`${newPlate} ya está en ${zoneInfo(newZone).label}, campo ${newCampo}`);
          return;
        }
      }

      const snap = snapshotZones();
      removePlateEntryByRef(zoneKey, targetCampoObj, targetEntry);
      getOrCreateCampo(newZone, newCampo).plates.push({ plate: newPlate, aseguradora: newAseguradora });
      pushUndo(snap);
      cleanup();
      await saveState();
      pendingResumenFilter = newPlate;
      renderAll();
    }
    async function onDelete(){
      if(!confirm(`¿Eliminar ${plate} del inventario?`)) return;
      const snap = snapshotZones();
      removePlateEntryByRef(zoneKey, targetCampoObj, targetEntry);
      pushUndo(snap);
      cleanup();
      await saveState();
      renderAll();
    }
    saveBtn.addEventListener("click", onSave);
    cancelBtn.addEventListener("click", onCancel);
    deleteBtn.addEventListener("click", onDelete);
    sinAsignarBtn.addEventListener("click", onSinAsignar);
  }

  function getOrCreateCampo(zoneKey, campoLabel){
    const arr = state.zones[zoneKey];
    let entry = arr.find(c => c.campo === campoLabel);
    if(!entry){
      entry = { campo: campoLabel, plates: [] };
      arr.push(entry);
      sortCampos(arr);
    }
    return entry;
  }

  function nextAutoCampo(zoneKey){
    const arr = state.zones[zoneKey];
    let max = 0;
    arr.forEach(c=>{ const n = parseInt(c.campo,10); if(!isNaN(n) && n>max) max = n; });
    return String(max+1);
  }

  // Intenta agregar `plate` al `campoLabel` de `zoneKey`. Maneja duplicados
  // preguntando si se debe mover. Devuelve true si finalmente se agregó.
  async function addPlateToZone(zoneKey, campoLabel, plateRaw, aseguradoraRaw){
    const plate = normalizePlate(plateRaw);
    if(!plate) return false;
    const aseguradora = (aseguradoraRaw || "").trim();
    const info = zoneInfo(zoneKey);
    const campo = campoLabel ? normalizeCampo(campoLabel) : nextAutoCampo(zoneKey);

    const dup = findPlate(plate);
    if(dup){
      if(dup.zoneKey === zoneKey && state.zones[zoneKey][dup.campoIdx].campo === campo){
        showToast(`${plate} ya está en el campo ${campo} de esta zona`);
        return false;
      }
      const dupInfo = zoneInfo(dup.zoneKey);
      const dupCampo = state.zones[dup.zoneKey][dup.campoIdx].campo;
      const choice = await askMoveOrCancel(plate, dupInfo.label, dupCampo, info.label, campo);
      if(choice !== "move") return false;
      removePlateAt(dup.zoneKey, dup.campoIdx, dup.plateIdx);
    }

    getOrCreateCampo(zoneKey, campo).plates.push({ plate, aseguradora });
    return true;
  }

  function occupancyHtml(zoneKey, campoCount, color){
    const cap = state.capacities[zoneKey];
    if(cap && cap > 0){
      const pct = Math.min(100, Math.round((campoCount / cap) * 100));
      return `
        <div class="occupancyRow">
          <div class="occupancyBar"><div class="occupancyBarFill" style="width:${pct}%; background:${color};"></div></div>
          <span class="occupancyText">${campoCount}/${cap} campos (${pct}%)</span>
          <button class="capacityEditBtn" id="capEdit">editar</button>
        </div>
      `;
    }
    return `
      <div class="occupancyRow">
        <span class="occupancyText">${campoCount} campo(s) ocupados</span>
        <button class="capacityEditBtn" id="capEdit">definir capacidad</button>
      </div>
    `;
  }

  function renderZonePanel(zone){
    const info = zoneInfo(zone.key);
    const campos = state.zones[zone.key] || [];
    const totalVeh = campos.reduce((a,c)=>a+c.plates.length,0);
    const wrap = document.createElement("div");
    wrap.className = "zonePanel active";
    wrap.style.setProperty("--zone-color", info.color);

    wrap.innerHTML = `
      <div class="zoneHeadCard">
        <h2>${info.label}</h2>
        <div class="sub">${totalVeh} vehículo(s) en ${campos.length} campo(s)</div>
        ${occupancyHtml(zone.key, campos.filter(c => c.campo !== SIN_ASIGNAR).length, info.color)}
      </div>
      <div class="addRow">
        <input type="text" id="campoInput_${info.abbr}" class="campoInput" placeholder="Campo">
        <input type="text" id="addInput_${info.abbr}" class="plate plateInputAdd" placeholder="Placa">
        <button id="addBtn_${info.abbr}">Agregar</button>
      </div>
      <div class="addRowSecondary">
        <input type="text" id="aseguradoraInput_${info.abbr}" placeholder="Aseguradora (opcional)">
      </div>
      <div class="dupWarn" id="dupWarn_${info.abbr}" style="display:none;"></div>
      <div class="addHint">Dejá "Campo" vacío para asignar el siguiente número disponible, o <button type="button" class="sinAsignarBtn" id="sinAsignarBtn_${info.abbr}">marcá como sin asignar</button>. Si el campo ya existe, la placa se suma a las que ya tiene.</div>
      <details class="bulk">
        <summary>Pegar varias placas a la vez</summary>
        <div class="bulkHint">Una por línea, formato "campo placa" (ej: 42 CL338850). Si solo ponés la placa, se le asigna un campo nuevo. La aseguradora se agrega después, editando cada placa.</div>
        <textarea id="bulkArea_${info.abbr}" placeholder="42 CL338850&#10;42 BQZ203&#10;AAA758"></textarea>
        <button class="bulkBtn" id="bulkBtn_${info.abbr}">Agregar todas</button>
      </details>
      <div class="campoList" id="campoList_${info.abbr}"></div>
      <div id="empty_${info.abbr}"></div>
    `;

    document.getElementById("mainArea").appendChild(wrap);

    wrap.querySelector("#capEdit").addEventListener("click", ()=>{
      const current = state.capacities[zone.key] || "";
      const input = prompt(`Capacidad total de espacios en ${info.label} (dejá vacío para quitarla):`, current);
      if(input === null) return;
      const trimmed = input.trim();
      if(trimmed === ""){
        delete state.capacities[zone.key];
      } else {
        const n = parseInt(trimmed, 10);
        if(isNaN(n) || n <= 0){ showToast("Ingresá un número válido"); return; }
        state.capacities[zone.key] = n;
      }
      saveState();
      renderAll();
    });


    const list = wrap.querySelector(`#campoList_${info.abbr}`);
    if(campos.length === 0){
      wrap.querySelector(`#empty_${info.abbr}`).innerHTML = `<div class="emptyState">Sin vehículos registrados en esta zona todavía.</div>`;
    } else {
      campos.forEach((c, ci)=>{
        const card = document.createElement("div");
        card.className = "campoCard";
        const isSinAsignar = c.campo === SIN_ASIGNAR;
        card.innerHTML = `
          <span class="campoNum${isSinAsignar ? " sinAsignar" : ""}" ${isSinAsignar ? "" : `style="background:${info.color}"`} data-ci="${ci}" title="Tocá para renombrar el campo">${escapeHtml(c.campo)}</span>
          <div class="campoBody">
            <div class="plateChips" data-ci="${ci}"></div>
          </div>
          <button class="campoDeleteBtn" data-ci="${ci}" title="Eliminar campo completo">✕</button>
        `;
        const chipsWrap = card.querySelector(".plateChips");
        c.plates.forEach((entry, pi)=>{
          const chip = document.createElement("span");
          chip.className = "plateChip";
          chip.dataset.ci = ci;
          chip.dataset.pi = pi;
          chip.title = "Tocá para editar placa, campo, zona o aseguradora";
          const isFirst = pi === 0;
          const isLast = pi === c.plates.length - 1 && c.plates.length > 1;
          const multi = c.plates.length > 1;
          chip.innerHTML = `
            <div class="plateChipMain">
              ${multi ? `<span class="orderMoveBtns">
                <button class="orderUp" data-ci="${ci}" data-pi="${pi}" title="Mover antes" ${isFirst ? "disabled" : ""}>▲</button>
                <button class="orderDown" data-ci="${ci}" data-pi="${pi}" title="Mover después" ${isLast ? "disabled" : ""}>▼</button>
              </span>` : ``}
              <span class="orderBadge" title="Orden de llegada">${pi+1}</span>
              <span class="plateText plate">${escapeHtml(entry.plate)}</span>
              ${isFirst ? '<span class="orderTag">primero</span>' : ''}
              ${isLast ? '<span class="orderTag last">último</span>' : ''}
              <button class="chipRm" data-ci="${ci}" data-pi="${pi}" title="Eliminar rápido">✕</button>
            </div>
            <div class="aseguradoraText" data-placeholder="sin aseguradora">${entry.aseguradora ? escapeHtml(entry.aseguradora) : ""}</div>
          `;
          chip.addEventListener("click", (e)=>{
            if(e.target.closest("button")) return;
            openEditLocModal(zone.key, ci, pi);
          });
          chipsWrap.appendChild(chip);
        });
        const addBtn = document.createElement("button");
        addBtn.className = "addPlateToCampoBtn";
        addBtn.dataset.ci = ci;
        addBtn.textContent = "+ vehículo";
        chipsWrap.appendChild(addBtn);
        list.appendChild(card);
      });
    }

    // --- eventos: renombrar el número de campo ---
    list.querySelectorAll(".campoNum").forEach(span=>{
      span.addEventListener("click", ()=>{
        const ci = parseInt(span.getAttribute("data-ci"),10);
        const current = state.zones[zone.key][ci].campo;
        const input = prompt("Nuevo número/nombre de campo:", current);
        if(input === null) return;
        const newCampo = normalizeCampo(input);
        if(!newCampo || newCampo === current) return;

        const existing = state.zones[zone.key].find(c => c.campo === newCampo);
        const snap = snapshotZones();
        if(existing){
          if(!confirm(`Ya existe el campo ${newCampo} en esta zona con ${existing.plates.length} vehículo(s). ¿Fusionar los vehículos de ${current} ahí?`)) return;
          existing.plates.push(...state.zones[zone.key][ci].plates);
          state.zones[zone.key].splice(ci,1);
        } else {
          state.zones[zone.key][ci].campo = newCampo;
        }
        sortCampos(state.zones[zone.key]);
        pushUndo(snap);
        saveState();
        renderAll();
      });
    });

    // --- eventos: reordenar manualmente el orden de llegada ---
    function movePlate(zoneKey, ci, pi, dir){
      const plates = state.zones[zoneKey][ci].plates;
      const target = pi + dir;
      if(target < 0 || target >= plates.length) return;
      const snap = snapshotZones();
      [plates[pi], plates[target]] = [plates[target], plates[pi]];
      pushUndo(snap);
      saveState();
      renderAll();
    }
    list.querySelectorAll(".orderUp").forEach(b=>{
      b.addEventListener("click", (e)=>{
        const ci = parseInt(e.target.getAttribute("data-ci"),10);
        const pi = parseInt(e.target.getAttribute("data-pi"),10);
        movePlate(zone.key, ci, pi, -1);
      });
    });
    list.querySelectorAll(".orderDown").forEach(b=>{
      b.addEventListener("click", (e)=>{
        const ci = parseInt(e.target.getAttribute("data-ci"),10);
        const pi = parseInt(e.target.getAttribute("data-pi"),10);
        movePlate(zone.key, ci, pi, 1);
      });
    });

    // --- eventos: eliminar placa individual ---
    list.querySelectorAll(".chipRm").forEach(b=>{
      b.addEventListener("click", (e)=>{
        const ci = parseInt(e.target.getAttribute("data-ci"),10);
        const pi = parseInt(e.target.getAttribute("data-pi"),10);
        const snap = snapshotZones();
        removePlateAt(zone.key, ci, pi);
        pushUndo(snap);
        saveState();
        renderAll();
      });
    });

    // --- eventos: agregar vehículo a un campo existente ---
    list.querySelectorAll(".addPlateToCampoBtn").forEach(b=>{
      b.addEventListener("click", async ()=>{
        const ci = parseInt(b.getAttribute("data-ci"),10);
        const campoLabel = state.zones[zone.key][ci].campo;
        const plate = prompt(`Nueva placa para el campo ${campoLabel}:`);
        if(plate === null) return;
        const snap = snapshotZones();
        const ok = await addPlateToZone(zone.key, campoLabel, plate);
        if(ok){ pushUndo(snap); saveState(); renderAll(); }
      });
    });

    // --- eventos: eliminar campo completo ---
    list.querySelectorAll(".campoDeleteBtn").forEach(b=>{
      b.addEventListener("click", ()=>{
        const ci = parseInt(b.getAttribute("data-ci"),10);
        const c = state.zones[zone.key][ci];
        if(c.plates.length > 1 && !confirm(`El campo ${c.campo} tiene ${c.plates.length} vehículos. ¿Eliminar todo el campo?`)) return;
        const snap = snapshotZones();
        state.zones[zone.key].splice(ci,1);
        pushUndo(snap);
        saveState();
        renderAll();
      });
    });

    // --- agregar (fila superior) ---
    const campoInput = wrap.querySelector(`#campoInput_${info.abbr}`);
    const addInput = wrap.querySelector(`#addInput_${info.abbr}`);
    const aseguradoraInput = wrap.querySelector(`#aseguradoraInput_${info.abbr}`);
    const addBtn = wrap.querySelector(`#addBtn_${info.abbr}`);
    const dupWarn = wrap.querySelector(`#dupWarn_${info.abbr}`);
    const sinAsignarBtn = wrap.querySelector(`#sinAsignarBtn_${info.abbr}`);

    sinAsignarBtn.addEventListener("click", ()=>{
      campoInput.value = SIN_ASIGNAR;
      addInput.focus();
    });

    function checkLiveDup(){
      const v = normalizePlate(addInput.value);
      if(!v){ dupWarn.style.display = "none"; return; }
      const dup = findPlate(v);
      if(dup){
        const dupInfo = zoneInfo(dup.zoneKey);
        const dupCampo = state.zones[dup.zoneKey][dup.campoIdx].campo;
        const mismaZona = dup.zoneKey === zone.key;
        dupWarn.innerHTML = `<span class="dupWarnIcon">⚠️</span> ${v} ya está registrada en ${mismaZona ? "esta zona" : dupInfo.label}, campo ${dupCampo}`;
        dupWarn.style.display = "flex";
      } else {
        dupWarn.style.display = "none";
      }
    }
    addInput.addEventListener("input", checkLiveDup);
    addInput.addEventListener("keyup", checkLiveDup);

    async function doAdd(){
      const plate = addInput.value;
      if(!normalizePlate(plate)) return;
      const snap = snapshotZones();
      const ok = await addPlateToZone(zone.key, campoInput.value, plate, aseguradoraInput.value);
      if(ok){
        pushUndo(snap);
        campoInput.value = "";
        addInput.value = "";
        aseguradoraInput.value = "";
        dupWarn.style.display = "none";
        saveState();
        renderAll();
      }
    }
    addBtn.addEventListener("click", doAdd);
    addInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") doAdd(); });
    campoInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") addInput.focus(); });
    aseguradoraInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") doAdd(); });

    // --- pegado masivo ---
    const bulkBtn = wrap.querySelector(`#bulkBtn_${info.abbr}`);
    const bulkArea = wrap.querySelector(`#bulkArea_${info.abbr}`);
    bulkBtn.addEventListener("click", async ()=>{
      const lines = bulkArea.value.split("\n").map(l=>l.trim()).filter(Boolean);
      if(lines.length===0) return;
      const snap = snapshotZones();
      let added = 0, skipped = 0;
      for(const line of lines){
        const parts = line.split(/\s+/);
        let campoLabel = null, plate;
        if(parts.length >= 2 && /^[0-9A-Za-z\-]+$/.test(parts[0]) && !isNaN(parseFloat(parts[0]))){
          campoLabel = parts[0];
          plate = parts.slice(1).join(" ");
        } else {
          plate = line;
        }
        const ok = await addPlateToZone(zone.key, campoLabel, plate);
        if(ok) added++; else skipped++;
      }
      if(added > 0) pushUndo(snap);
      bulkArea.value = "";
      saveState();
      renderAll();
      showToast(skipped===0 ? `${added} placa(s) agregada(s)` : `${added} agregada(s), ${skipped} omitida(s) (duplicadas o canceladas)`, 3200);
    });

    return wrap;
  }

  function buildResumenRows(){
    const rows = [];
    ZONES.forEach(z=>{
      (state.zones[z.key]||[]).forEach((c, ci)=>{
        c.plates.forEach((entry, pi)=>{
          rows.push({ zoneKey: z.key, zoneLabel: z.label, color: z.color, campo: c.campo, placa: entry.plate, aseguradora: entry.aseguradora || "", ci, pi });
        });
      });
    });
    return rows;
  }

  function renderResumenPanel(){
    const wrap = document.createElement("div");
    wrap.className = "zonePanel active";

    const chips = ZONES.map(z=>{
      const camposCount = (state.zones[z.key]||[]).filter(c => c.campo !== SIN_ASIGNAR).length;
      const vehCount = (state.zones[z.key]||[]).reduce((a,cc)=>a+cc.plates.length,0);
      const cap = state.capacities[z.key];
      const occ = (cap && cap > 0) ? ` · ${camposCount}/${cap} campos` : ``;
      return `<div class="chip"><span class="dot" style="background:${z.color}"></span>${z.label}: ${vehCount} veh${occ}</div>`;
    }).join("");

    wrap.innerHTML = `
      <div class="zoneChips">${chips}</div>
      <div class="resumenToolbar">
        <div class="filterField">
          <svg class="filterIcon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="6"/><line x1="13.5" y1="13.5" x2="18" y2="18"/></svg>
          <input type="text" id="resumenFilter" placeholder="Buscar por placa o campo…" class="plate" autocomplete="off">
        </div>
        <div class="filterField selectField">
          <select id="resumenZoneFilter">
            <option value="">Todas las zonas</option>
            ${ZONES.map(z=>`<option value="${z.key}">${z.label}</option>`).join("")}
          </select>
        </div>
        <button class="clearFilterBtn" id="resumenClear" style="display:none;">Limpiar filtros</button>
      </div>
      <div class="resultsCount" id="resultsCount"></div>
      <table>
        <thead><tr><th style="width:70px;">Campo</th><th>Placa</th><th>Zona</th><th>Aseguradora</th></tr></thead>
        <tbody id="resumenTbody"></tbody>
      </table>
      <div id="resumenEmpty"></div>
    `;
    document.getElementById("mainArea").appendChild(wrap);

    if(pendingResumenFilter){
      wrap.querySelector("#resumenFilter").value = pendingResumenFilter;
      pendingResumenFilter = "";
    }

    const filterInput = wrap.querySelector("#resumenFilter");
    const zoneSelect = wrap.querySelector("#resumenZoneFilter");
    const clearBtn = wrap.querySelector("#resumenClear");

    function draw(){
      const filterText = filterInput.value.trim().toUpperCase();
      const filterZone = zoneSelect.value;
      clearBtn.style.display = (filterText || filterZone) ? "inline-block" : "none";

      let rows = buildResumenRows();
      const totalCount = rows.length;
      if(filterZone) rows = rows.filter(r=>r.zoneKey===filterZone);
      if(filterText) rows = rows.filter(r=> r.placa.toUpperCase().includes(filterText) || String(r.campo).toUpperCase().includes(filterText) || (r.aseguradora||"").toUpperCase().includes(filterText));

      const countEl = wrap.querySelector("#resultsCount");
      countEl.textContent = (filterText || filterZone)
        ? `${rows.length} de ${totalCount} vehículo(s)`
        : `${totalCount} vehículo(s) en total`;

      const tbody = wrap.querySelector("#resumenTbody");
      tbody.innerHTML = "";
      if(rows.length===0){
        wrap.querySelector("#resumenEmpty").innerHTML = `<div class="emptyState">No hay resultados.</div>`;
      } else {
        wrap.querySelector("#resumenEmpty").innerHTML = "";
        rows.forEach(r=>{
          const tr = document.createElement("tr");
          tr.className = "resumenRow";
          tr.dataset.zone = r.zoneKey;
          tr.dataset.ci = r.ci;
          tr.dataset.pi = r.pi;
          tr.innerHTML = `
            <td><span class="spotNum${r.campo===SIN_ASIGNAR?" sinAsignar":""}" style="background:${r.color}">${escapeHtml(r.campo)}</span></td>
            <td class="plate">${escapeHtml(r.placa)}</td>
            <td>${r.zoneLabel}</td>
            <td>${r.aseguradora ? escapeHtml(r.aseguradora) : '<span style="color:var(--muted);">—</span>'}</td>
          `;
          tr.addEventListener("click", ()=>{
            openEditLocModal(r.zoneKey, r.ci, r.pi);
          });
          tbody.appendChild(tr);
        });
      }
    }
    filterInput.addEventListener("input", draw);
    filterInput.addEventListener("keyup", draw);
    filterInput.addEventListener("change", draw);
    zoneSelect.addEventListener("change", draw);
    clearBtn.addEventListener("click", ()=>{
      filterInput.value = "";
      zoneSelect.value = "";
      draw();
      filterInput.focus();
    });
    draw();
  }

  function renderAll(){
    renderTabs();
    const main = document.getElementById("mainArea");
    main.innerHTML = "";
    if(activeTab === "__resumen__"){
      renderResumenPanel();
    } else {
      renderZonePanel(zoneInfo(activeTab));
    }
    renderMeta();
  }

  // ---- Global search ----
  const searchInput = document.getElementById("globalSearch");
  const searchResults = document.getElementById("searchResults");

  function runSearch(q){
    q = q.trim().toUpperCase();
    if(!q){ searchResults.classList.remove("show"); searchResults.innerHTML=""; return; }
    const rows = buildResumenRows().filter(r=>r.placa.toUpperCase().includes(q));
    if(rows.length===0){
      searchResults.innerHTML = `<div class="searchItem" style="cursor:default;">Sin coincidencias</div>`;
    } else {
      searchResults.innerHTML = rows.slice(0,25).map(r=>`
        <div class="searchItem" data-zone="${r.zoneKey}">
          <span class="plate">${escapeHtml(r.placa)}</span>
          <span class="tag">${r.zoneLabel} · campo ${escapeHtml(r.campo)}</span>
        </div>
      `).join("");
      searchResults.querySelectorAll(".searchItem").forEach(el=>{
        el.addEventListener("click", ()=>{
          const zone = el.getAttribute("data-zone");
          const placaTexto = el.querySelector(".plate") ? el.querySelector(".plate").textContent : "";
          pendingResumenFilter = placaTexto;
          activeTab = "__resumen__";
          searchInput.value = "";
          searchResults.classList.remove("show");
          renderAll();
        });
      });
    }
    searchResults.classList.add("show");
  }
  searchInput.addEventListener("input", (e)=> runSearch(e.target.value));
  searchInput.addEventListener("keyup", (e)=> runSearch(e.target.value));
  searchInput.addEventListener("blur", ()=> setTimeout(()=>searchResults.classList.remove("show"), 150));
  searchInput.addEventListener("focus", (e)=> { if(e.target.value) runSearch(e.target.value); });
  searchInput.addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){
      e.preventDefault();
      const q = searchInput.value.trim();
      if(!q) return;
      pendingResumenFilter = q;
      activeTab = "__resumen__";
      searchInput.value = "";
      searchResults.classList.remove("show");
      renderAll();
    }
  });

  // ---- Export ----
  document.getElementById("exportBtn").addEventListener("click", ()=>{
    const wb = XLSX.utils.book_new();
    const now = new Date();
    const fechaLarga = now.toLocaleDateString("es-CR", {day:"2-digit", month:"long", year:"numeric"});
    const horaLarga = now.toLocaleTimeString("es-CR", {hour:"2-digit", minute:"2-digit"});

    ZONES.forEach(z=>{
      const campos = state.zones[z.key] || [];
      const totalVeh = campos.reduce((a,c)=>a+c.plates.length,0);
      const cap = state.capacities[z.key];
      const capTxt = (cap && cap>0) ? ` · ${campos.length}/${cap} campos ocupados` : ``;

      const data = [
        [`${z.label} — Inventario de Parqueo`, "", ""],
        [`Generado ${fechaLarga}, ${horaLarga} · ${totalVeh} vehículo(s) en ${campos.length} campo(s)${capTxt}`, "", ""],
        [],
        ["Campo","Placa","Aseguradora"]
      ];
      campos.forEach(c => c.plates.forEach(p => data.push([c.campo, p.plate, p.aseguradora || ""])));

      const ws = XLSX.utils.aoa_to_sheet(data);
      ws["!merges"] = [
        { s:{r:0,c:0}, e:{r:0,c:2} },
        { s:{r:1,c:0}, e:{r:1,c:2} }
      ];
      ws["!cols"] = [{ wch: 14 }, { wch: 22 }, { wch: 20 }];
      if(data.length > 4){
        ws["!autofilter"] = { ref: `A4:C${data.length}` };
      }
      XLSX.utils.book_append_sheet(wb, ws, z.label.substring(0,31));
    });

    const resumenRows = buildResumenRows();
    const resumenData = [
      ["Resumen general — Inventario de Parqueo", "", "", ""],
      [`Generado ${fechaLarga}, ${horaLarga} · ${resumenRows.length} vehículo(s) en total`, "", "", ""],
      [],
      ["Campo","Placa","Zona","Aseguradora"]
    ];
    resumenRows.forEach(r=> resumenData.push([r.campo, r.placa, r.zoneLabel, r.aseguradora || ""]));
    const wsResumen = XLSX.utils.aoa_to_sheet(resumenData);
    wsResumen["!merges"] = [
      { s:{r:0,c:0}, e:{r:0,c:3} },
      { s:{r:1,c:0}, e:{r:1,c:3} }
    ];
    wsResumen["!cols"] = [{ wch: 14 }, { wch: 22 }, { wch: 24 }, { wch: 20 }];
    if(resumenData.length > 4){
      wsResumen["!autofilter"] = { ref: `A4:D${resumenData.length}` };
    }
    XLSX.utils.book_append_sheet(wb, wsResumen, "Resumen");

    const fecha = now.toISOString().slice(0,10);
    XLSX.writeFile(wb, `Inventario_Parqueo_${fecha}.xlsx`);
    showToast("Excel generado");
  });

  // ==================== Control de acceso ====================
  // Aviso: esto es un candado simple del lado del cliente para evitar
  // que cualquiera entre sin saber usuario/clave. No es seguridad de
  // nivel empresarial: el código de esta app es visible para quien
  // inspeccione el archivo. Las contraseñas se guardan como hash
  // (no en texto plano), pero esto no reemplaza un sistema con servidor.

  let currentUser = null; // { username }

  async function loadUsers(){
    try{
      const res = await window.storage.get(USERS_KEY, true);
      if(res && res.value) return JSON.parse(res.value);
    }catch(e){ /* no existe todavía */ }
    return [];
  }
  async function saveUsers(list){
    try{
      const result = await window.storage.set(USERS_KEY, JSON.stringify(list), true);
      return !!(result && typeof result === "object");
    }catch(e){
      console.error("Error guardando usuarios", e);
      return false;
    }
  }
  async function hashPassword(username, password){
    const enc = new TextEncoder();
    const data = enc.encode(String(username).trim().toLowerCase() + "::" + password);
    const buf = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  async function getSessionUsername(){
    try{
      const res = await window.storage.get(SESSION_KEY, false);
      if(res && res.value) return res.value;
    }catch(e){ /* no hay sesión guardada */ }
    return null;
  }
  async function setSessionUsername(username){
    try{ await window.storage.set(SESSION_KEY, username, false); }catch(e){ /* no crítico */ }
  }
  async function clearSession(){
    try{ await window.storage.delete(SESSION_KEY, false); }catch(e){ /* no crítico */ }
  }

  function showSetupScreen(onSubmit){
    document.getElementById("authChecking").style.display = "none";
    document.getElementById("authLogin").style.display = "none";
    document.getElementById("authSetup").style.display = "block";
    const userInput = document.getElementById("setupUser");
    const passInput = document.getElementById("setupPass");
    const pass2Input = document.getElementById("setupPass2");
    const errorP = document.getElementById("setupError");
    const btn = document.getElementById("setupBtn");
    async function submit(){
      const u = userInput.value.trim();
      const p = passInput.value;
      const p2 = pass2Input.value;
      errorP.textContent = "";
      if(!u){ errorP.textContent = "Ingresá un nombre de usuario."; return; }
      if(p.length < 4){ errorP.textContent = "La contraseña debe tener al menos 4 caracteres."; return; }
      if(p !== p2){ errorP.textContent = "Las contraseñas no coinciden."; return; }
      btn.disabled = true;
      await onSubmit(u, p);
    }
    btn.addEventListener("click", submit);
    [userInput, passInput, pass2Input].forEach(inp=> inp.addEventListener("keydown", (e)=>{ if(e.key==="Enter") submit(); }));
    userInput.focus();
  }

  function showLoginScreen(onSubmit){
    document.getElementById("authChecking").style.display = "none";
    document.getElementById("authSetup").style.display = "none";
    document.getElementById("authLogin").style.display = "block";
    const userInput = document.getElementById("loginUser");
    const passInput = document.getElementById("loginPass");
    const errorP = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");
    async function submit(){
      const u = userInput.value.trim();
      const p = passInput.value;
      errorP.textContent = "";
      if(!u || !p){ errorP.textContent = "Ingresá usuario y contraseña."; return; }
      btn.disabled = true;
      const ok = await onSubmit(u, p);
      btn.disabled = false;
      if(!ok){
        errorP.textContent = "Usuario o contraseña incorrectos.";
        passInput.value = "";
        passInput.focus();
      }
    }
    btn.addEventListener("click", submit);
    [userInput, passInput].forEach(inp=> inp.addEventListener("keydown", (e)=>{ if(e.key==="Enter") submit(); }));
    userInput.focus();
  }

  function revealApp(){
    document.getElementById("authGate").style.display = "none";
    document.getElementById("appRoot").style.display = "block";
    const chip = document.getElementById("userChip");
    if(chip) chip.textContent = currentUser ? currentUser.username : "";
    (async function(){
      await loadState();
      renderAll();
      updateUndoBtn();
    })();
  }

  async function runAuthGate(){
    const authAvailable = await checkStorageAvailable();
    if(!authAvailable){
      showToast("No se pudo activar el control de acceso en este navegador", 3800);
      revealApp();
      return;
    }

    const users = await loadUsers();

    if(users.length === 0){
      showSetupScreen(async (username, password)=>{
        const hash = await hashPassword(username, password);
        await saveUsers([{ username, hash }]);
        currentUser = { username };
        await setSessionUsername(username);
        revealApp();
      });
      return;
    }

    const sessionUser = await getSessionUsername();
    if(sessionUser){
      const found = users.find(u => u.username.toLowerCase() === sessionUser.toLowerCase());
      if(found){
        currentUser = { username: found.username };
        revealApp();
        return;
      }
    }

    showLoginScreen(async (username, password)=>{
      const users2 = await loadUsers(); // por si otro usuario se agregó mientras tanto
      const found = users2.find(u => u.username.toLowerCase() === username.toLowerCase());
      if(!found) return false;
      const hash = await hashPassword(found.username, password);
      if(hash !== found.hash) return false;
      currentUser = { username: found.username };
      await setSessionUsername(found.username);
      revealApp();
      return true;
    });
  }

  async function openUsersModal(){
    const overlay = document.getElementById("usersModal");
    const listEl = document.getElementById("usersList");
    const errorP = document.getElementById("usersError");
    const newUserName = document.getElementById("newUserName");
    const newUserPass = document.getElementById("newUserPass");
    errorP.textContent = "";
    newUserName.value = "";
    newUserPass.value = "";

    let users = await loadUsers();

    function draw(){
      listEl.innerHTML = users.map(u => `
        <div class="userRow">
          <span class="userRowName">${escapeHtml(u.username)} ${currentUser && u.username.toLowerCase()===currentUser.username.toLowerCase() ? '<span class="userRowMe">(vos)</span>' : ''}</span>
          <button class="userRemoveBtn" data-username="${escapeAttr(u.username)}" ${users.length<=1 ? "disabled title=\"Debe quedar al menos un usuario\"" : ""}>Quitar</button>
        </div>
      `).join("");
      listEl.querySelectorAll(".userRemoveBtn").forEach(b=>{
        b.addEventListener("click", async ()=>{
          const uname = b.getAttribute("data-username");
          if(!confirm(`¿Quitar el acceso de "${uname}"?`)) return;
          users = users.filter(u => u.username !== uname);
          await saveUsers(users);
          draw();
        });
      });
    }
    draw();
    overlay.classList.add("show");

    const addBtn = document.getElementById("addUserBtn");
    const closeBtn = document.getElementById("usersCloseBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    async function onAdd(){
      const uname = newUserName.value.trim();
      const pass = newUserPass.value;
      errorP.textContent = "";
      if(!uname){ errorP.textContent = "Ingresá un nombre de usuario."; return; }
      if(users.some(u=>u.username.toLowerCase()===uname.toLowerCase())){ errorP.textContent = "Ese usuario ya existe."; return; }
      if(pass.length < 4){ errorP.textContent = "La contraseña debe tener al menos 4 caracteres."; return; }
      const hash = await hashPassword(uname, pass);
      users.push({ username: uname, hash });
      const ok = await saveUsers(users);
      if(!ok){ errorP.textContent = "No se pudo guardar el usuario, intentá de nuevo."; return; }
      newUserName.value = "";
      newUserPass.value = "";
      draw();
    }
    function onClose(){
      overlay.classList.remove("show");
      addBtn.removeEventListener("click", onAdd);
      closeBtn.removeEventListener("click", onClose);
      logoutBtn.removeEventListener("click", onLogout);
    }
    async function onLogout(){
      if(!confirm("¿Cerrar sesión?")) return;
      await clearSession();
      location.reload();
    }
    addBtn.addEventListener("click", onAdd);
    closeBtn.addEventListener("click", onClose);
    logoutBtn.addEventListener("click", onLogout);
  }
  document.getElementById("usersBtn").addEventListener("click", openUsersModal);

  document.getElementById("undoBtn").addEventListener("click", doUndo);

  // ---- Init ----
  runAuthGate();


})();
</script>
</body>
</html>

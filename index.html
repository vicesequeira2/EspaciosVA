    const fechaLarga = now.toLocaleDateString("es-CR", {day:"2-digit", month:"long", year:"numeric"});
    const horaLarga = now.toLocaleTimeString("es-CR", {hour:"2-digit", minute:"2-digit"});

    ZONES.forEach(z=>{
      const campos = state.zones[z.key] || [];
      const totalVeh = campos.reduce((a,c)=>a+c.plates.length,0);
      const cap = state.capacities[z.key];
      const capTxt = (cap && cap>0) ? ` · ${campos.length}/${cap} campos ocupados` : ``;

      const data = [
        [`${z.label} — Inventario de Parqueo`, "", "", ""],
        [`Generado ${fechaLarga}, ${horaLarga} · ${totalVeh} vehículo(s) en ${campos.length} campo(s)${capTxt}`, "", "", ""],
        [],
        ["Campo","Placa","Aseguradora","Modelo"]
      ];
      campos.forEach(c => c.plates.forEach(p => data.push([c.campo, p.plate, p.aseguradora || "", p.modelo || ""])));

      const ws = XLSX.utils.aoa_to_sheet(data);
      ws["!merges"] = [
        { s:{r:0,c:0}, e:{r:0,c:3} },
        { s:{r:1,c:0}, e:{r:1,c:3} }
      ];
      ws["!cols"] = [{ wch: 14 }, { wch: 22 }, { wch: 20 }, { wch: 22 }];
      if(data.length > 4){
        ws["!autofilter"] = { ref: `A4:D${data.length}` };
      }
      XLSX.utils.book_append_sheet(wb, ws, z.label.substring(0,31));
    });

    const resumenRows = buildResumenRows();
    const resumenData = [
      ["Resumen general — Inventario de Parqueo", "", "", "", ""],
      [`Generado ${fechaLarga}, ${horaLarga} · ${resumenRows.length} vehículo(s) en total`, "", "", "", ""],
      [],
      ["Campo","Placa","Zona","Aseguradora","Modelo"]
    ];
    resumenRows.forEach(r=> resumenData.push([r.campo, r.placa, r.zoneLabel, r.aseguradora || "", r.modelo || ""]));
    const wsResumen = XLSX.utils.aoa_to_sheet(resumenData);
    wsResumen["!merges"] = [
      { s:{r:0,c:0}, e:{r:0,c:4} },
      { s:{r:1,c:0}, e:{r:1,c:4} }
    ];
    wsResumen["!cols"] = [{ wch: 14 }, { wch: 22 }, { wch: 24 }, { wch: 20 }, { wch: 22 }];
    if(resumenData.length > 4){
      wsResumen["!autofilter"] = { ref: `A4:E${resumenData.length}` };
    }
    XLSX.utils.book_append_sheet(wb, wsResumen, "Resumen");

    // ---- Hoja: conteo por Aseguradora y por Modelo ----
    const conteoAseguradora = {};
    const conteoModelo = {};
    resumenRows.forEach(r=>{
      const aseg = r.aseguradora || "(sin aseguradora)";
      const mod = r.modelo || "(sin modelo)";
      conteoAseguradora[aseg] = (conteoAseguradora[aseg] || 0) + 1;
      conteoModelo[mod] = (conteoModelo[mod] || 0) + 1;
    });
    const conteoData = [
      ["Conteo por Aseguradora y Modelo — Inventario de Parqueo", ""],
      [`Generado ${fechaLarga}, ${horaLarga}`, ""],
      [],
      ["Aseguradora", "Vehículos"]
    ];
    Object.keys(conteoAseguradora).sort((a,b)=> conteoAseguradora[b]-conteoAseguradora[a]).forEach(k=>{
      conteoData.push([k, conteoAseguradora[k]]);
    });
    conteoData.push([]);
    conteoData.push(["Modelo", "Vehículos"]);
    Object.keys(conteoModelo).sort((a,b)=> conteoModelo[b]-conteoModelo[a]).forEach(k=>{
      conteoData.push([k, conteoModelo[k]]);
    });
    const wsConteo = XLSX.utils.aoa_to_sheet(conteoData);
    wsConteo["!merges"] = [
      { s:{r:0,c:0}, e:{r:0,c:1} },
      { s:{r:1,c:0}, e:{r:1,c:1} }
    ];
    wsConteo["!cols"] = [{ wch: 26 }, { wch: 12 }];
    XLSX.utils.book_append_sheet(wb, wsConteo, "Por Aseguradora y Modelo");

    // ---- Hoja: alerta de placas duplicadas (si alguna aparece en más de un lugar) ----
    const porPlaca = {};
    resumenRows.forEach(r=>{
      const key = r.placa.toUpperCase();
      if(!porPlaca[key]) porPlaca[key] = [];
      porPlaca[key].push(r);
    });
    const duplicadas = Object.values(porPlaca).filter(list => list.length > 1);
    if(duplicadas.length > 0){
      const dupData = [
        ["⚠ Placas duplicadas detectadas — revisar", "", "", ""],
        [`Generado ${fechaLarga}, ${horaLarga} · ${duplicadas.length} placa(s) con más de una ubicación`, "", "", ""],
        [],
        ["Placa","Zona","Campo","Aseguradora"]
      ];
      duplicadas.forEach(list=>{
        list.forEach(r=> dupData.push([r.placa, r.zoneLabel, r.campo, r.aseguradora || ""]));
        dupData.push([]);
      });
      const wsDup = XLSX.utils.aoa_to_sheet(dupData);
      wsDup["!merges"] = [
        { s:{r:0,c:0}, e:{r:0,c:3} },
        { s:{r:1,c:0}, e:{r:1,c:3} }
      ];
      wsDup["!cols"] = [{ wch: 16 }, { wch: 24 }, { wch: 14 }, { wch: 20 }];
      XLSX.utils.book_append_sheet(wb, wsDup, "Placas duplicadas");
    }

    const fecha = now.toISOString().slice(0,10);
    XLSX.writeFile(wb, `Inventario_Parqueo_${fecha}.xlsx`);
    showToast(duplicadas.length > 0 ? `Excel generado — se detectaron ${duplicadas.length} placa(s) duplicada(s)` : "Excel generado");
  });

  // ==================== Control de acceso con roles ====================
  // Aviso: esto sigue siendo un candado del lado del cliente (sin servidor).
  // Cada acción sensible valida el rol tanto al construir la interfaz (para
  // no mostrar botones que no corresponden) como dentro de la función que
  // ejecuta la acción (para que forzar un botón oculto por consola no
  // alcance a mover/borrar nada si el rol no lo permite).

  const ROLES = {
    admin: "Administrador",
    consulta: "Búsqueda",
    actualizacion: "Actualización"
  };

  let currentUser = null; // { username, role }
  let clockInterval = null;

  async function hashUserPassword(username, password){
    const enc = new TextEncoder();
    const data = enc.encode(String(username).trim().toLowerCase() + "::" + password);
    const buf = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }

  async function loadUsers(){
    try{
      const res = await window.storage.get(USERS_KEY, true);
      if(res && res.value) return JSON.parse(res.value);
    }catch(e){ /* no existe todavía */ }
    return [];
  }
  async function saveUsers(list){
    try{
      const result = await window.storage.set(USERS_KEY, JSON.stringify(list), true);
      return !!(result && typeof result === "object");
    }catch(e){ console.error("Error guardando usuarios", e); return false; }
  }

  async function appendLog(key, entry, limit){
    let list = [];
    try{
      const res = await window.storage.get(key, true);
      if(res && res.value) list = JSON.parse(res.value);
    }catch(e){ /* la clave todavía no existe: arrancamos con lista vacía */ }
    list.push(entry);
    if(list.length > limit) list = list.slice(list.length - limit);
    try{
      await window.storage.set(key, JSON.stringify(list), true);
    }catch(e){ /* el registro de historial nunca debe romper la acción principal */ }
  }
  async function readLog(key){
    try{
      const res = await window.storage.get(key, true);
      if(res && res.value) return JSON.parse(res.value);
    }catch(e){ /* sin historial todavía */ }
    return [];
  }

  function showLoginScreen(onRoleSubmit, onAdminSubmit){
    document.getElementById("authChecking").style.display = "none";
    document.getElementById("authPasswordScreen").style.display = "block";

    const logosBox = document.getElementById("roleLogos");
    const roleForm = document.getElementById("roleLoginForm");
    const roleLabel = document.getElementById("roleLoginLabel");
    const rolePass = document.getElementById("rolePass");
    const roleError = document.getElementById("roleLoginError");
    const roleBtn = document.getElementById("roleLoginBtn");
    const roleBack = document.getElementById("roleLoginBack");
    const adminLink = document.getElementById("adminHiddenLink");
    const adminForm = document.getElementById("adminLoginForm");
    const userInput = document.getElementById("loginUser");
    const passInput = document.getElementById("accessPass");
    const errorP = document.getElementById("accessError");
    const btn = document.getElementById("accessBtn");
    const adminBack = document.getElementById("adminLoginBack");

    let selectedRole = null;

    function showLogos(){
      logosBox.style.display = "flex";
      roleForm.style.display = "none";
      adminForm.style.display = "none";
      adminLink.style.display = "block";
    }
    function showRoleForm(role){
      selectedRole = role;
      roleLabel.textContent = role === "consulta" ? "Acceso de Búsqueda" : "Acceso de Actualización";
      logosBox.style.display = "none";
      roleForm.style.display = "block";
      adminLink.style.display = "none";
      roleError.textContent = "";
      rolePass.value = "";
      rolePass.focus();
    }
    function showAdminForm(){
      logosBox.style.display = "none";
      adminLink.style.display = "none";
      adminForm.style.display = "block";
      errorP.textContent = "";
      userInput.focus();
    }

    logosBox.querySelectorAll(".roleLogoBtn").forEach(b=>{
      b.addEventListener("click", ()=> showRoleForm(b.getAttribute("data-role")));
    });
    roleBack.addEventListener("click", showLogos);
    adminBack.addEventListener("click", showLogos);
    adminLink.addEventListener("click", showAdminForm);

    async function submitRole(){
      const p = rolePass.value;
      roleError.textContent = "";
      if(!p){ roleError.textContent = "Ingresá la contraseña."; return; }
      roleBtn.disabled = true;
      const ok = await onRoleSubmit(selectedRole, p);
      roleBtn.disabled = false;
      if(!ok){
        roleError.textContent = "Contraseña incorrecta.";
        rolePass.value = "";
        rolePass.focus();
      }
    }
    roleBtn.addEventListener("click", submitRole);
    rolePass.addEventListener("keydown", (e)=>{ if(e.key==="Enter") submitRole(); });

    async function submitAdmin(){
      const u = userInput.value.trim();
      const p = passInput.value;
      errorP.textContent = "";
      if(!u || !p){ errorP.textContent = "Ingresá usuario y contraseña."; return; }
      btn.disabled = true;
      const ok = await onAdminSubmit(u, p);
      btn.disabled = false;
      if(!ok){
        errorP.textContent = "Usuario o contraseña incorrectos.";
        passInput.value = "";
        passInput.focus();
      }
    }
    btn.addEventListener("click", submitAdmin);
    [userInput, passInput].forEach(inp=> inp.addEventListener("keydown", (e)=>{ if(e.key==="Enter") submitAdmin(); }));

    showLogos();
  }

  // otra persona hizo cambios mientras esta pestaña seguía abierta) y
  // refresca la vista sin perder el filtro que ya tenías escrito.
  async function refreshDataFromStorage(silent){
    if(!storageAvailable){
      if(!silent) showToast("Sin conexión al almacenamiento compartido");
      return;
    }
    try{
      let preservedFilter = "";
      if(activeTab === "__resumen__"){
        const fi = document.getElementById("resumenFilter");
        if(fi) preservedFilter = fi.value;
      }
      await loadState();
      if(currentUser.role === "actualizacion"){
        renderUpdaterPanel();
      } else {
        if(preservedFilter) pendingResumenFilter = preservedFilter;
        renderAll();
        updateUndoBtn();
      }
      if(!silent) showToast("Datos actualizados");
    }catch(e){
      console.error("Error actualizando datos", e);
      if(!silent) showToast("No se pudo actualizar. Intentá de nuevo.");
    }
  }

  function startAutoRefreshIfNeeded(){

  async function runAuthGate(){
    storageAvailable = false;
    let sessionUsername = null;
    try{
      await withTimeout(ensureFirebaseAuth(), 6000, "Firebase tardó demasiado en responder.").catch(()=>{ fbReady = !!fbDb; });
      storageAvailable = await checkStorageAvailable();
      if(storageAvailable){
        sessionUsername = await getSessionUsername();
      }
    }catch(e){
      console.error("Firebase no disponible, la app sigue funcionando sin guardado permanente", e);
      /* sin sesión recordada */
    }

    let users = storageAvailable ? await loadUsers() : [];
    if(users.length === 0){
      users = await seedDefaultAdmin();
      if(storageAvailable){
        await saveUsers(users);
      }
    }

    if(sessionUsername){
      const found = users.find(u => u.username.toLowerCase() === sessionUsername.toLowerCase() && u.active !== false);
      if(found){
        currentUser = { username: found.username, role: found.role };
        revealApp();
        return;
      }
    }

    async function tryLogin(found, password){
      if(!found || found.active === false){
        if(storageAvailable) await logAccess(found ? found.username : "?", "login_failed");
        return false;
      }
      const hash = await hashUserPassword(found.username, password);
      if(hash !== found.hash){
        if(storageAvailable) await logAccess(found.username, "login_failed");
        return false;
      }
      currentUser = { username: found.username, role: found.role };
      if(storageAvailable){
        await setSessionUsername(found.username);
        await logAccess(found.username, "login");
      }
      revealApp();
      return true;
    }

    showLoginScreen(
      // Logos de Consulta / Actualización: solo piden contraseña; se prueba
      // contra cualquier cuenta activa que tenga ese rol.
      async (role, password)=>{
        const freshUsers = storageAvailable ? await loadUsers() : users;
        const candidates = freshUsers.filter(u => u.role === role && u.active !== false);
        for(const candidate of candidates){
          const hash = await hashUserPassword(candidate.username, password);
          if(hash === candidate.hash){
            return await tryLogin(candidate, password);
          }
        }
        if(storageAvailable) await logAccess(`(${ROLES[role]||role})`, "login_failed");
        return false;
      },
      // Acceso administrador, detrás del enlace discreto: usuario + contraseña.
      async (username, password)=>{
        const freshUsers = storageAvailable ? await loadUsers() : users;
        const found = freshUsers.find(u => u.username.toLowerCase() === username.toLowerCase());
        return await tryLogin(found, password);
      }
    );
  }

  // ---- Gestión de usuarios (solo Admin) ----
  async function openUsersModal(){
    if(!guardEdit()) return;
    const overlay = document.getElementById("usersModal");
    const listEl = document.getElementById("usersList");
    const errorP = document.getElementById("usersError");
    const nameInput = document.getElementById("newUserName");
    const passInput = document.getElementById("newUserPass");
    const roleSelect = document.getElementById("newUserRole");
    errorP.textContent = ""; nameInput.value = ""; passInput.value = ""; roleSelect.value = "consulta";

    let users = await loadUsers();

    function draw(){
      listEl.innerHTML = users.map((u,i)=>`
        <div class="userRow ${u.active===false ? 'inactive' : ''}">
          <div class="userRowInfo">
            <span class="userRowName">${escapeHtml(u.username)} ${currentUser.username.toLowerCase()===u.username.toLowerCase() ? '<span class="userRowMe">(vos)</span>' : ''}</span>
            <span class="userRowRole">${ROLES[u.role] || u.role}${u.active===false ? ' · inactivo' : ''}</span>
          </div>
          <div class="userRowBtns">
            <button class="renameUserBtn" data-i="${i}">Renombrar</button>
            <button class="resetPassBtn" data-i="${i}">Restablecer clave</button>
            <button class="toggleActiveBtn" data-i="${i}">${u.active===false ? "Activar" : "Desactivar"}</button>
            <button class="removeUserBtn" data-i="${i}" ${users.length<=1 ? 'disabled title="Debe quedar al menos un usuario"' : ''}>Quitar</button>
          </div>
        </div>
      `).join("");
      listEl.querySelectorAll(".renameUserBtn").forEach(b=>{
        b.addEventListener("click", async ()=>{
          const i = parseInt(b.getAttribute("data-i"),10);
          const oldName = users[i].username;
          const newName = prompt(`Nuevo nombre de usuario (antes "${oldName}"):`, oldName);
          if(newName === null) return;
          const trimmed = newName.trim();
          if(!trimmed){ errorP.textContent = "Ingresá un nombre de usuario."; return; }
          if(users.some((u,j)=> j!==i && u.username.toLowerCase()===trimmed.toLowerCase())){
            errorP.textContent = "Ese usuario ya existe."; return;
          }
          if(trimmed.toLowerCase() === oldName.toLowerCase()){ return; }
          // La contraseña queda protegida usando el usuario como parte del hash,
          // así que renombrar exige volver a definir la contraseña.
          const newPass = prompt(`Definí la contraseña para "${trimmed}" (mínimo 4 caracteres):`);
          if(newPass === null) return;
          if(newPass.length < 4){ errorP.textContent = "La contraseña debe tener al menos 4 caracteres."; return; }
          users[i].username = trimmed;
          users[i].hash = await hashUserPassword(trimmed, newPass);
          const ok = await saveUsers(users);
          if(!ok){ errorP.textContent = "No se pudo guardar, intentá de nuevo."; return; }
          errorP.textContent = "";
          showToast(`Usuario renombrado a "${trimmed}"`);
          draw();
        });
      });
      listEl.querySelectorAll(".resetPassBtn").forEach(b=>{
        b.addEventListener("click", async ()=>{
          const i = parseInt(b.getAttribute("data-i"),10);
          const uname = users[i].username;
          const newPass = prompt(`Nueva contraseña para "${uname}" (mínimo 4 caracteres):`);
          if(newPass === null) return;
          if(newPass.length < 4){ errorP.textContent = "La contraseña debe tener al menos 4 caracteres."; return; }
          users[i].hash = await hashUserPassword(uname, newPass);
          const ok = await saveUsers(users);
          errorP.textContent = ok ? "" : "No se pudo guardar, intentá de nuevo.";
          if(ok) showToast(`Contraseña de "${uname}" actualizada`);
        });
      });
      listEl.querySelectorAll(".toggleActiveBtn").forEach(b=>{
        b.addEventListener("click", async ()=>{
          const i = parseInt(b.getAttribute("data-i"),10);
          users[i].active = users[i].active === false ? true : false;
          await saveUsers(users);
          draw();
        });
      });
      listEl.querySelectorAll(".removeUserBtn").forEach(b=>{
        b.addEventListener("click", async ()=>{
          const i = parseInt(b.getAttribute("data-i"),10);
          if(!confirm(`¿Quitar el acceso de "${users[i].username}"?`)) return;
          users.splice(i,1);
          await saveUsers(users);
          draw();
        });
      });
    }
    draw();
    overlay.classList.add("show");

    const addBtn = document.getElementById("addUserBtn");
    const closeBtn = document.getElementById("usersCloseBtn");
    async function onAdd(){
      const uname = nameInput.value.trim();
      const pass = passInput.value;
      const role = roleSelect.value;
      errorP.textContent = "";
      if(!uname){ errorP.textContent = "Ingresá un nombre de usuario."; return; }
      if(users.some(u=>u.username.toLowerCase()===uname.toLowerCase())){ errorP.textContent = "Ese usuario ya existe."; return; }
      if(pass.length < 4){ errorP.textContent = "La contraseña debe tener al menos 4 caracteres."; return; }
      const hash = await hashUserPassword(uname, pass);
      users.push({ username: uname, hash, role, active: true });
      const ok = await saveUsers(users);
      if(!ok){ errorP.textContent = "No se pudo guardar, intentá de nuevo."; return; }
      nameInput.value = ""; passInput.value = "";
      draw();
    }
    function onClose(){
      overlay.classList.remove("show");
      addBtn.removeEventListener("click", onAdd);
      closeBtn.removeEventListener("click", onClose);
    }
    addBtn.addEventListener("click", onAdd);
    closeBtn.addEventListener("click", onClose);
  }
  document.getElementById("usersBtn").addEventListener("click", openUsersModal);

  // ---- Pantalla dedicada del rol Actualización ----
  async function renderUpdaterPanel(){
    if(!(currentUser && currentUser.role === "actualizacion")) return;
    await loadState();
    const holder = document.getElementById("updaterPanel");
    holder.innerHTML = `
      <div class="updaterCard">
        <h2>Actualizar ubicación</h2>
        <input type="text" id="updSearchInput" class="plate" placeholder="Buscar placa (te lleva a su espacio actual)…" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid #d7d8d3;">
        <label style="margin-top:14px;">Zona <span class="zoneConfirmHint" id="zoneConfirmHint" style="display:none;"></span></label>
        <div class="zoneChipsRow" id="updSpaceZoneChips"></div>
        <label id="updSpaceCampoLabel">Campos</label>

        <div class="updaterZoneFilterRow" id="updZoneFilterRow"></div>

    `;
    const searchInput = holder.querySelector("#updSearchInput");
    const listFilterInput = holder.querySelector("#updListFilter");
    const zoneFilterRow = holder.querySelector("#updZoneFilterRow");
    const allListBox = holder.querySelector("#updAllList");
    let selectedListZone = ""; // "" = todas las zonas

    function drawZoneFilterRow(){
      const allRows = buildResumenRows();
      const totalCount = allRows.length;
      const countsByZone = {};
      allRows.forEach(r=>{ countsByZone[r.zoneKey] = (countsByZone[r.zoneKey]||0) + 1; });
      zoneFilterRow.innerHTML = `
        <button type="button" class="updaterZoneChip${selectedListZone==="" ? " active" : ""}" data-zone="">Todas <span class="count">${totalCount}</span></button>
        ${ZONES.map(z=>`
          <button type="button" class="updaterZoneChip${selectedListZone===z.key ? " active" : ""}" data-zone="${z.key}" style="--chip-color:#${z.hex}">${z.label} <span class="count">${countsByZone[z.key]||0}</span></button>
        `).join("")}
      `;
      zoneFilterRow.querySelectorAll(".updaterZoneChip").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          selectedListZone = btn.getAttribute("data-zone");
          zoneFilterRow.querySelectorAll(".updaterZoneChip").forEach(b=>b.classList.remove("active"));
          btn.classList.add("active");
          drawAllList();
        });
      });
    }

    function drawAllList(){
      const q = listFilterInput.value.trim().toUpperCase();
      let rows = buildResumenRows();
      const totalCount = rows.length;
      if(selectedListZone) rows = rows.filter(r => r.zoneKey === selectedListZone);
      const countAfterZone = rows.length;
      if(q){
        rows = rows.filter(r =>
          r.placa.toUpperCase().includes(q) ||
          String(r.campo).toUpperCase().includes(q) ||
          r.zoneLabel.toUpperCase().includes(q) ||
          (r.aseguradora||"").toUpperCase().includes(q) ||
          (r.modelo||"").toUpperCase().includes(q)
        );
      }
      if(totalCount === 0){
        allListBox.innerHTML = `<div class="dashEmptyNote">Todavía no hay vehículos registrados.</div>`;
        return;
      }
      const zoneLabel = selectedListZone ? zoneInfo(selectedListZone).label : null;
      const title = (q || selectedListZone)
        ? `${rows.length} de ${zoneLabel ? countAfterZone : totalCount} vehículo(s)${zoneLabel ? ` en ${zoneLabel}` : ""}`
        : `Todos los vehículos (${totalCount}) — tocá uno para ir a su espacio`;

      function rowHtml(r){
        return `
          <div class="updaterAllListRow${wasUpdatedToday(r) ? ' updatedToday' : ''}" data-plate="${escapeAttrLike(r.placa)}">
            <span class="plate">${escapeHtml(r.placa)} ${wasUpdatedToday(r) ? '<span class="updatedTodayTag" title="Se actualizó hoy">✓ hoy</span>' : ''}</span>
            <span class="updaterAllListMeta">${r.zoneLabel} · campo ${escapeHtml(r.campo)}</span>
          </div>
        `;
      }

      let listHtml;
      if(rows.length === 0){
        listHtml = `<div class="dashEmptyNote">Sin resultados para ese filtro.</div>`;
      } else if(!selectedListZone){
        listHtml = ZONES.map(z=>{
          const zoneRows = rows.filter(r => r.zoneKey === z.key);
          if(zoneRows.length === 0) return "";
          return `
            <div class="updaterZoneGroupHeader"><span class="dot" style="background:${z.color}"></span>${z.label} <span class="count">${zoneRows.length}</span></div>
            ${zoneRows.map(rowHtml).join("")}
          `;
        }).join("");
      } else {
        listHtml = rows.map(rowHtml).join("");
      }

      allListBox.innerHTML = `
        <div class="updaterAllListTitle">${title}</div>
        <div class="updaterAllListScroll">${listHtml}</div>
      `;

        row.addEventListener("click", ()=>{
          goToPlate(row.getAttribute("data-plate"));
        });
      });
    }
    listFilterInput.addEventListener("input", drawAllList);
    listFilterInput.addEventListener("keyup", drawAllList);

    // ---- Zona + espacio: ver quién ya está ahí, editar/quitar, agregar o mover ----
    const spaceZoneChipsBox = holder.querySelector("#updSpaceZoneChips");
    const spaceCampoLabel = holder.querySelector("#updSpaceCampoLabel");
    const spaceGridBox = holder.querySelector("#updSpaceGrid");
    const spaceInfoBox = holder.querySelector("#updSpaceInfo");
    const zoneConfirmHint = holder.querySelector("#zoneConfirmHint");
    let spaceZone = ZONES[0].key;
    let selectedCampo = ""; // campo/línea elegido dentro de la zona actual
    let editingPlateIdx = null; // índice (dentro del campo) de la placa en edición, o null
    let armedZoneKey = null; // zona "armada" esperando el segundo toque para confirmar el cambio

    // Cambiar de zona pide tocar dos veces (para no perder de vista el
    // espacio actual por un toque accidental cerca de otra zona).
    function drawSpaceZoneChips(){
      spaceZoneChipsBox.innerHTML = ZONES.map(z=>`
        <button type="button" class="zoneChipBtn${spaceZone===z.key?' active':''}${armedZoneKey===z.key?' armed':''}" data-zone="${z.key}" style="--chip-color:#${z.hex}">${z.label}${armedZoneKey===z.key ? " ¿Cambiar?" : ""}</button>
      `).join("");
      zoneConfirmHint.style.display = armedZoneKey ? "inline" : "none";
      if(armedZoneKey) zoneConfirmHint.textContent = "Tocá de nuevo para confirmar";
      spaceZoneChipsBox.querySelectorAll(".zoneChipBtn").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const zoneKey = btn.getAttribute("data-zone");
          if(zoneKey === spaceZone){
            armedZoneKey = null;
            drawSpaceZoneChips();
            return;
          }
          if(armedZoneKey === zoneKey){
            // segundo toque sobre la misma zona: confirma el cambio
            spaceZone = zoneKey;
            armedZoneKey = null;
            selectedCampo = "";
            editingPlateIdx = null;
            drawSpaceZoneChips();
            refreshSpaceGrid();
          } else {
            // primer toque: solo "arma" la zona, todavía no cambia
            armedZoneKey = zoneKey;
            drawSpaceZoneChips();
          }
        });
      });
    }

    function refreshSpaceGrid(preselect){
      const label = UNNUMBERED_ONLY_ZONES.has(spaceZone) ? "Líneas" : "Campos";
      spaceCampoLabel.textContent = label;
      if(preselect !== undefined) selectedCampo = preselect;
      const arr = state.zones[spaceZone] || [];
      spaceGridBox.innerHTML = arr.map(c=>{
        const cap = c.capacidad;
        const occ = c.plates.length;
        let fillClass = "empty";
        if(occ > 0){
          fillClass = (cap && occ >= cap) ? "full" : "partial";
        }
        return `
          <button type="button" class="spaceGridBtn ${fillClass}${selectedCampo===c.campo ? ' active' : ''}" data-campo="${escapeAttrLike(c.campo)}">
            <span class="spaceGridLabel">${escapeHtml(c.campo)}</span>
            <span class="spaceGridCount">${occ}${cap ? "/"+cap : ""}</span>
          </button>
        `;
      }).join("");
      spaceGridBox.querySelectorAll(".spaceGridBtn").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          selectedCampo = btn.getAttribute("data-campo");
          editingPlateIdx = null;
          spaceGridBox.querySelectorAll(".spaceGridBtn").forEach(b=>b.classList.remove("active"));
          btn.classList.add("active");
          drawSpaceInfo();
        });
      });
      editingPlateIdx = null;
      drawSpaceInfo();
    }

    // Busca una placa y salta directo a su zona/espacio actual, listo para
    // editarla, quitarla o simplemente verla junto a las demás de ese lugar.
    function goToPlate(plateRaw){
      const q = normalizePlate(plateRaw);
      if(!q) return;
      const found = findPlate(q);
      if(!found){
        showToast(`${q} no se encontró. Elegí zona y espacio para registrarla ahí.`);
        return;
      }
      spaceZone = found.zoneKey;
      armedZoneKey = null;
      drawSpaceZoneChips();
      const campoLabel = state.zones[found.zoneKey][found.campoIdx].campo;
      refreshSpaceGrid(campoLabel);
      if(typeof spaceInfoBox.scrollIntoView === "function") spaceInfoBox.scrollIntoView({behavior:"smooth", block:"start"});
    }
    searchInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") goToPlate(searchInput.value); });

    function drawSpaceInfo(){
      const campoLabel = selectedCampo;
      if(!campoLabel){ spaceInfoBox.innerHTML = ""; return; }
      const entry = (state.zones[spaceZone] || []).find(c => c.campo === campoLabel);
      if(!entry){ spaceInfoBox.innerHTML = ""; return; }
      const cap = entry.capacidad;
      const occ = entry.plates.length;
      const full = cap && occ >= cap;
      const labelLower = UNNUMBERED_ONLY_ZONES.has(spaceZone) ? "línea" : "campo";

      const plateRowsHtml = entry.plates.length ? entry.plates.map((p,idx)=>{
        if(idx === editingPlateIdx){
          return `
            <div class="spaceEditForm" data-idx="${idx}">
              <div class="spaceEditQuickRow">
                <input type="text" id="spaceEditPlaca" class="plate" value="${escapeHtml(p.plate)}" placeholder="Placa">
                <input type="text" id="spaceEditAseg" value="${escapeHtml(p.aseguradora || "")}" placeholder="Aseguradora">
                <input type="text" id="spaceEditModelo" value="${escapeHtml(p.modelo || "")}" placeholder="Modelo">
              </div>
              <div class="dupWarn" id="spaceEditDupWarn" style="display:none;"></div>
              <button type="button" class="linkBackBtn" id="spaceEditMoveToggle" style="text-decoration:none; font-weight:700; margin-top:6px;">📍 Cambiar de zona/campo</button>
              <div id="spaceEditMoveBox" style="display:none;">
                <label style="margin-top:8px;">Nueva zona</label>
                <div class="zoneChipsRow" id="spaceEditZoneChips"></div>
                <label for="spaceEditCampo" id="spaceEditCampoLabel">Nuevo ${labelLower}</label>
                <input type="text" id="spaceEditCampo" class="plate" value="${escapeHtml(campoLabel)}">
              </div>
              <div class="modalActions" style="margin-top:10px; flex-direction:row; gap:8px;">
                <button type="button" class="primaryBtn" id="spaceEditSaveBtn" style="flex:1;">Guardar</button>
                <button type="button" class="secondaryBtn" id="spaceEditCancelBtn" style="flex:1;">Cancelar</button>
                <button type="button" class="dangerBtn" id="spaceEditRemoveBtn" style="flex:0 0 auto;" title="Quitar">✕</button>
              </div>
            </div>
          `;
        }
        return `
          <div class="spacePlateRow" data-idx="${idx}">
            <span class="orderBadge">${idx+1}</span>
            <span class="spacePlateInfo">${escapeHtml(p.plate)}${p.aseguradora ? ` · ${escapeHtml(p.aseguradora)}` : ""}${p.modelo ? ` · ${escapeHtml(p.modelo)}` : ""}</span>
            <button type="button" class="spaceEditBtn" data-idx="${idx}" title="Editar">✏️</button>
            <button type="button" class="spaceRemoveBtn" data-idx="${idx}" title="Quitar">✕</button>
          </div>
        `;
      }).join("") : `<div class="dashEmptyNote">Sin vehículos en este ${labelLower} todavía.</div>`;

      spaceInfoBox.innerHTML = `
        <div class="spaceInfoHeader">
          <strong>${zoneInfo(spaceZone).label} · ${escapeHtml(campoLabel)}</strong>
          ${cap ? `<span class="spaceCapBadge${full ? " full" : ""}">${occ}/${cap}</span>` : ``}
        </div>
        ${plateRowsHtml}
        ${full ? `<div class="similarWarn" style="margin-top:8px;"><span class="dupWarnIcon">⚠️</span> Este ${labelLower} está lleno (${occ}/${cap}). Podés agregar igual si hace falta.</div>` : ``}
        <label style="margin-top:12px;">Agregar o mover una placa acá</label>
        <input type="text" id="updSpaceNewPlaca" class="plate" placeholder="Placa">
        <input type="text" id="updSpaceNewAseguradora" placeholder="Aseguradora (opcional)" style="margin-top:6px;">
        <input type="text" id="updSpaceNewModelo" placeholder="Modelo (opcional)" style="margin-top:6px;">
        <div class="dupWarn" id="updSpaceDupWarn" style="display:none;"></div>
        <div class="similarWarn" id="updSpaceSimilarWarn" style="display:none;"></div>
        <button type="button" class="primaryBtn authBtn" id="updSpaceAddBtn">Agregar en este espacio</button>
      `;

      // Quita una placa de este espacio (compartido entre el botón de la fila y el de edición)
      async function removePlateFromSpace(idx){
        const plateToRemove = entry.plates[idx];
        if(!confirm(`¿Quitar ${plateToRemove.plate} de este ${labelLower}?`)) return;
        removePlateEntryByRef(spaceZone, entry, plateToRemove);
        await saveState(true);
        await appendLog(HISTORY_KEY, {
          ts: nowStamp(),
          username: currentUser.username,
          placa: plateToRemove.plate,
          desde: `${zoneInfo(spaceZone).label} · campo ${campoLabel}`,
          hasta: "Eliminado del inventario"
        }, 300);
        showToast("Vehículo eliminado");
        editingPlateIdx = null;
        const stillExists = (state.zones[spaceZone] || []).some(c => c.campo === campoLabel);
        refreshSpaceGrid(stillExists ? campoLabel : "");
        drawZoneFilterRow();
        drawAllList();
      }

      // --- edición inline de una placa ya existente ---
      if(editingPlateIdx !== null){
        let editTargetZone = spaceZone;
        const editPlacaInput = spaceInfoBox.querySelector("#spaceEditPlaca");
        const editDupWarn = spaceInfoBox.querySelector("#spaceEditDupWarn");
        const editAsegInput = spaceInfoBox.querySelector("#spaceEditAseg");
        const editModeloInput = spaceInfoBox.querySelector("#spaceEditModelo");
        const editCampoInput = spaceInfoBox.querySelector("#spaceEditCampo");
        const moveToggleBtn = spaceInfoBox.querySelector("#spaceEditMoveToggle");
        const moveBox = spaceInfoBox.querySelector("#spaceEditMoveBox");
        const originalPlate = entry.plates[editingPlateIdx].plate;

        const editZoneChipsBox = spaceInfoBox.querySelector("#spaceEditZoneChips");
        editZoneChipsBox.innerHTML = ZONES.map(z=>`
          <button type="button" class="zoneChipBtn${spaceZone===z.key?' active':''}" data-zone="${z.key}" style="--chip-color:#${z.hex}">${z.label}</button>
        `).join("");
        editZoneChipsBox.querySelectorAll(".zoneChipBtn").forEach(btn=>{
          btn.addEventListener("click", ()=>{
            editTargetZone = btn.getAttribute("data-zone");
            editZoneChipsBox.querySelectorAll(".zoneChipBtn").forEach(b=>b.classList.remove("active"));
            btn.classList.add("active");
            spaceInfoBox.querySelector("#spaceEditCampoLabel").textContent = `Nuevo ${UNNUMBERED_ONLY_ZONES.has(editTargetZone) ? "línea" : "campo"}`;
            editCampoInput.value = (editTargetZone === spaceZone) ? campoLabel : "";
          });
        });

        moveToggleBtn.addEventListener("click", ()=>{
          const show = moveBox.style.display === "none";
          moveBox.style.display = show ? "block" : "none";
          moveToggleBtn.style.display = show ? "none" : "block";
        });

        function checkEditPlateDup(){
          const v = normalizePlate(editPlacaInput.value);
          if(!v || v === originalPlate){ editDupWarn.style.display = "none"; return; }
          const dup = findPlate(v, spaceZone, state.zones[spaceZone].indexOf(entry), editingPlateIdx);
          if(dup){
            const dupInfo = zoneInfo(dup.zoneKey);
            const dupCampo = state.zones[dup.zoneKey][dup.campoIdx].campo;
            editDupWarn.innerHTML = `<span class="dupWarnIcon">⚠️</span> ${v} ya existe en ${dupInfo.label}, campo ${dupCampo}. Al guardar, se preguntará si se mueve.`;
            editDupWarn.style.display = "flex";
          } else {
            editDupWarn.style.display = "none";
          }
        }
        editPlacaInput.addEventListener("input", checkEditPlateDup);
        editPlacaInput.addEventListener("keyup", checkEditPlateDup);

        async function saveEdit(){
          const newPlate = editPlacaInput.value;
          const newAseguradora = editAsegInput.value.trim();
          const newModelo = editModeloInput.value.trim();
          const newCampo = normalizeCampo(editCampoInput.value);
          if(!newCampo){ showToast("Ingresá un campo válido"); return; }
          if(!normalizePlate(newPlate)){ showToast("Ingresá una placa válida"); return; }
          const idxToEdit = editingPlateIdx;
          const currentEntry = (state.zones[spaceZone] || []).find(c => c.campo === campoLabel);
          const ci = state.zones[spaceZone].indexOf(currentEntry);
          const ok = await updaterConfirmMove(spaceZone, ci, idxToEdit, editTargetZone, newCampo, newAseguradora, newModelo, "last", newPlate);
          if(!ok) return; // canceló el diálogo de mover, o no había nada que cambiar: seguimos en edición
          showToast("Vehículo actualizado");
          editingPlateIdx = null;
          if(editTargetZone !== spaceZone){
            spaceZone = editTargetZone;
            drawSpaceZoneChips();
            refreshSpaceGrid(newCampo);
          } else {
            refreshSpaceGrid(newCampo);
          }
          drawZoneFilterRow();
          drawAllList();
        }
        spaceInfoBox.querySelector("#spaceEditSaveBtn").addEventListener("click", saveEdit);
        spaceInfoBox.querySelector("#spaceEditCancelBtn").addEventListener("click", ()=>{
          editingPlateIdx = null;
          drawSpaceInfo();
        });
        spaceInfoBox.querySelector("#spaceEditRemoveBtn").addEventListener("click", ()=> removePlateFromSpace(editingPlateIdx));
        [editPlacaInput, editAsegInput, editModeloInput, editCampoInput].forEach(inp=>{
          inp.addEventListener("keydown", (e)=>{ if(e.key==="Enter") saveEdit(); });
        });
        editPlacaInput.focus();
        editPlacaInput.select();
      }

      spaceInfoBox.querySelectorAll(".spaceEditBtn").forEach(b=>{
        b.addEventListener("click", ()=>{
          editingPlateIdx = parseInt(b.getAttribute("data-idx"),10);
          drawSpaceInfo();
        });
      });
      spaceInfoBox.querySelectorAll(".spaceRemoveBtn").forEach(b=>{
        b.addEventListener("click", ()=> removePlateFromSpace(parseInt(b.getAttribute("data-idx"),10)));
      });

      // --- agregar o mover una placa a este espacio ---
      const spacePlacaInput = spaceInfoBox.querySelector("#updSpaceNewPlaca");
      const spaceDupWarn = spaceInfoBox.querySelector("#updSpaceDupWarn");
      const spaceSimilarWarn = spaceInfoBox.querySelector("#updSpaceSimilarWarn");
      const spaceAddBtn = spaceInfoBox.querySelector("#updSpaceAddBtn");

      function checkSpacePlateInfo(){
        const v = normalizePlate(spacePlacaInput.value);
        if(!v){ spaceDupWarn.style.display = "none"; spaceSimilarWarn.style.display = "none"; return; }
        const dup = findPlate(v);
        if(dup){
          const dupInfo = zoneInfo(dup.zoneKey);
          const dupCampo = state.zones[dup.zoneKey][dup.campoIdx].campo;
          const yaAca = dup.zoneKey === spaceZone && dupCampo === campoLabel;
          if(yaAca){
            spaceDupWarn.innerHTML = `<span class="dupWarnIcon">⚠️</span> ${v} ya está en este mismo ${labelLower}.`;
          } else {
            spaceDupWarn.innerHTML = `<span class="dupWarnIcon">🔁</span> ${v} está en ${dupInfo.label}, campo ${dupCampo}. Al confirmar, se moverá acá.`;
          }
          spaceDupWarn.style.display = "flex";
          spaceSimilarWarn.style.display = "none";
        } else {
          spaceDupWarn.style.display = "none";
          const similares = findSimilarPlates(v);
          if(similares.length > 0){
            const items = similares.map(s=>{
              const zi = zoneInfo(s.zoneKey);
              const campo = state.zones[s.zoneKey][s.campoIdx].campo;
              return `<button type="button" class="useSimilarBtn" data-plate="${escapeAttrLike(s.plate)}">${s.plate}</button> (${zi.label}, campo ${campo})`;
            }).join(", ");
            spaceSimilarWarn.innerHTML = `<span class="dupWarnIcon">🔍</span><span class="similarList">¿Es alguna de estas? ${items}</span>`;
            spaceSimilarWarn.style.display = "flex";
            spaceSimilarWarn.querySelectorAll(".useSimilarBtn").forEach(b=>{
              b.addEventListener("click", ()=>{
                spacePlacaInput.value = b.getAttribute("data-plate");
                checkSpacePlateInfo();
              });
            });
          } else {
            spaceSimilarWarn.style.display = "none";
          }
        }
      }
      spacePlacaInput.addEventListener("input", checkSpacePlateInfo);
      spacePlacaInput.addEventListener("keyup", checkSpacePlateInfo);

      async function confirmSpaceAdd(){
        const plateRaw = spacePlacaInput.value;
        if(!normalizePlate(plateRaw)){ showToast("Ingresá una placa válida"); return; }
        const aseguradora = spaceInfoBox.querySelector("#updSpaceNewAseguradora").value;
        const modelo = spaceInfoBox.querySelector("#updSpaceNewModelo").value;
        const ok = await updaterAddNew(spaceZone, campoLabel, plateRaw, aseguradora, modelo, "last");
        if(ok){
          lastAddZoneKey = spaceZone;
          showToast("Listo — vehículo en este espacio");
          refreshSpaceGrid(campoLabel);
          drawZoneFilterRow();
          drawAllList();
        }
      }
      spaceAddBtn.addEventListener("click", confirmSpaceAdd);
      spacePlacaInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") confirmSpaceAdd(); });
    }

    drawSpaceZoneChips();
    refreshSpaceGrid();

    drawZoneFilterRow();
    drawAllList();
  }

  // Escape simple para usar dentro de un atributo data-*, igual que escapeHtml.
  function escapeAttrLike(s){
    return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
  }

  async function updaterConfirmMove(zoneKey, ci, pi, newZone, newCampo, newAseguradora, newModelo, position, newPlateRaw){
    if(!(currentUser && currentUser.role === "actualizacion")){
      showToast("Tu usuario no tiene permiso para esta acción");
      return false;
    }
    const campoObj = state.zones[zoneKey][ci];
    const entry = campoObj.plates[pi];
    const fromCampo = campoObj.campo;
    const newPlate = newPlateRaw ? normalizePlate(newPlateRaw) : entry.plate;
    if(!newPlate){ showToast("Ingresá una placa válida"); return false; }

    const plateChanged = newPlate !== entry.plate;
    if(plateChanged){
      const dup = findPlate(newPlate, zoneKey, ci, pi);
      if(dup){
        const dupInfo = zoneInfo(dup.zoneKey);
        const dupCampoObj = state.zones[dup.zoneKey][dup.campoIdx];
        const dupEntry = dupCampoObj.plates[dup.plateIdx];
        const choice = await askMoveOrCancel(newPlate, dupInfo.label, dupCampoObj.campo, zoneInfo(newZone).label, newCampo);
        if(choice !== "move") return false;
        removePlateEntryByRef(dup.zoneKey, dupCampoObj, dupEntry);
      }
    }

    const locationChanged = !(newZone === zoneKey && newCampo === fromCampo);
    const aseguradoraChanged = newAseguradora !== (entry.aseguradora || "");
    const modeloChanged = newModelo !== (entry.modelo || "");
    if(!locationChanged && !aseguradoraChanged && !modeloChanged && !plateChanged) return false;

    entry.plate = newPlate;
    entry.aseguradora = newAseguradora;
    entry.modelo = newModelo;
    entry.lastUpdated = new Date().toISOString();

    if(locationChanged){
      removePlateEntryByRef(zoneKey, campoObj, entry);
      insertPlateAtPosition(getOrCreateCampo(newZone, newCampo), entry, position || "last");
    }
    await saveState(true);
    if(locationChanged){
      await logUpdate(entry.plate, zoneKey, fromCampo, newZone, newCampo);
    }
    return true;
  }

  async function updaterAddNew(zoneKey, campoRaw, plateRaw, aseguradoraRaw, modeloRaw, position){
    if(!(currentUser && currentUser.role === "actualizacion")){
      showToast("Tu usuario no tiene permiso para esta acción");
      return false;
    }
    const campo = campoRaw ? normalizeCampo(campoRaw) : nextAutoCampo(zoneKey);
    const ok = await addPlateToZone(zoneKey, campo, plateRaw, aseguradoraRaw, modeloRaw, position);
    if(ok){
      await saveState(true);
      await logUpdate(normalizePlate(plateRaw), null, null, zoneKey, campo);
    }
    return ok;
  }

  document.getElementById("logoutBtn").addEventListener("click", async ()=>{
    if(!confirm("¿Cerrar sesión?")) return;
    if(currentUser) await logAccess(currentUser.username, "logout");
    if(clockInterval) clearInterval(clockInterval);
    if(autoRefreshInterval) clearInterval(autoRefreshInterval);
    await clearSession();
    location.reload();
  });

  document.getElementById("undoBtn").addEventListener("click", ()=>{ if(guardEdit()) doUndo(); });

  // ---- Init ----
  runAuthGate();


})();
</script>
</body>
</html>

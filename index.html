<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Inventario de Parqueo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-database-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-auth-compat.min.js"></script>
<style>
  :root{
    --asphalt: #24272b;
    --asphalt-2: #2f3338;
    --asphalt-3: #3a3f45;
    --line: #f2c230;
    --line-dim: #b8912a;
    --paper: #f4f5f2;
    --ink: #1b1e21;
    --muted: #8b9198;
    --ok: #4caf7d;
    --danger: #d9553f;
    --z-avaluo: #4f8fd1;
    --z-avaluo-puff: #8fb9e0;
    --z-atras: #5fb37a;
    --z-atras-entregas: #8ccb9e;
    --z-atras-solidos: #2f7a4a;
    --z-malla: #a175d4;
    --z-maya-sn: #c7a6e8;
    --z-neon: #e0529c;
    --z-pge: #e2843a;
    --radius: 10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }
  .plate{
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  header{
    background: linear-gradient(180deg, var(--asphalt) 0%, var(--asphalt-2) 100%);
    color: var(--paper);
    padding: 18px 16px 14px;
    position: sticky; top:0; z-index: 20;
    border-bottom: 4px solid var(--line);
  }
  header .top-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  header h1{
    font-size: 1.15rem;
    margin:0;
    font-weight: 800;
    letter-spacing: 0.02em;
  }
  header h1 .dash{color:var(--line);}
  .meta{
    font-size: 0.72rem;
    color: var(--muted);
    margin-top:2px;
  }
  #exportBtn{
    background: var(--line);
    color: var(--asphalt);
    border:none;
    font-weight:700;
    padding: 6px 12px;
    border-radius: var(--radius);
    font-size: 0.74rem;
    cursor:pointer;
    white-space:nowrap;
  }
  #exportBtn:active{transform: translateY(1px);}
  .headerBtns{
    display:flex; flex-direction:column; gap:6px; align-items:stretch;
  }
  #undoBtn{
    background: transparent;
    color: var(--paper);
    border:1px solid var(--asphalt-3);
    font-weight:600;
    padding: 6px 14px;
    border-radius: var(--radius);
    font-size: 0.76rem;
    cursor:pointer;
    white-space:nowrap;
  }
  #undoBtn:disabled{
    opacity:0.35;
    cursor:default;
  }
  #undoBtn:not(:disabled):active{transform: translateY(1px);}
  .searchWrap{
    position:relative;
    margin-top:12px;
  }
  #globalSearch{
    width:100%;
    padding: 10px 14px;
    border-radius: var(--radius);
    border: 1px solid var(--asphalt-3);
    background: var(--asphalt-2);
    color: var(--paper);
    font-size: 0.95rem;
  }
  #globalSearch::placeholder{color:var(--muted);}
  #globalSearch:focus{outline:2px solid var(--line);}
  #searchResults{
    position:absolute;
    left:0; right:0; top:calc(100% + 4px);
    background: var(--asphalt-2);
    border:1px solid var(--asphalt-3);
    border-radius: var(--radius);
    max-height: 260px;
    overflow-y:auto;
    z-index: 30;
    display:none;
  }
  #searchResults.show{display:block;}
  .searchItem{
    padding:9px 14px;
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer;
    border-bottom:1px solid var(--asphalt-3);
    color: var(--paper);
    font-size:0.9rem;
  }
  .searchItem:last-child{border-bottom:none;}
  .searchItem:hover{background:var(--asphalt-3);}
  .searchItem .tag{font-size:0.72rem; color: var(--muted);}
  nav#tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding: 12px 12px 0;
    background: var(--paper);
    position: sticky; top: 104px; z-index: 15;
    border-bottom: 1px solid #dfe0dc;
  }
  nav#tabs::-webkit-scrollbar{display:none;}
  .tabBtn{
    flex: 0 0 auto;
    padding: 8px 14px;
    border-radius: 999px 999px 0 0;
    border: none;
    background: #e6e7e2;
    color: var(--ink);
    font-weight:600;
    font-size: 0.82rem;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    margin-bottom:-1px;
  }
  .tabBtn .dot{width:8px;height:8px;border-radius:50%;}
  .tabBtn.active{
    background: var(--paper);
    border: 1px solid #dfe0dc;
    border-bottom: 3px solid var(--zone-color, var(--line));
  }
  .tabBtn .count{
    background: rgba(0,0,0,0.08);
    padding: 1px 6px;
    border-radius: 999px;
    font-size:0.72rem;
  }
  main{padding: 16px;}
  .zonePanel{display:none;}
  .zonePanel.active{display:block;}
  .zoneHeadCard{
    background:white;
    border-radius: var(--radius);
    padding:14px 16px;
    margin-bottom:14px;
    border-left: 6px solid var(--zone-color);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .zoneHeadCard h2{margin:0 0 2px; font-size:1rem;}
  .zoneHeadCard .sub{font-size:0.78rem; color:var(--muted);}
  .occupancyRow{
    display:flex; align-items:center; gap:8px;
    margin-top:8px;
  }
  .occupancyBar{
    flex:1;
    height:7px;
    border-radius:999px;
    background:#eceee9;
    overflow:hidden;
  }
  .occupancyBarFill{
    height:100%;
    border-radius:999px;
    background: var(--zone-color);
  }
  .occupancyText{
    font-size:0.74rem;
    color:var(--muted);
    white-space:nowrap;
  }
  .capacityEditBtn{
    background:none;
    border:none;
    color: var(--zone-color);
    font-size:0.74rem;
    font-weight:700;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
    white-space:nowrap;
  }
  .addRow{
    display:flex; gap:8px; margin-bottom:10px;
  }
  .addRow input.campoInput{
    width: 84px;
    flex: 0 0 auto;
  }
  .addRow input{
    padding:10px 12px;
    border-radius: var(--radius);
    border:1px solid #d7d8d3;
    font-size:0.95rem;
  }
  .addRow input.plateInputAdd{ flex:1; }
  .addRow button{
    background: var(--ink);
    color:white;
    border:none;
    border-radius: var(--radius);
    padding: 0 16px;
    font-weight:700;
    cursor:pointer;
    font-size:0.85rem;
  }
  .addRowSecondary{
    display:flex; gap:8px;
    margin-bottom:8px;
  }
  .addRowSecondary input{
    flex:1;
    min-width:0;
    padding:8px 12px;
    border-radius: var(--radius);
    border:1px solid #e2e3de;
    background:#fbfbfa;
    font-size:0.85rem;
  }
  .addRowSecondary input:focus{
    outline:none;
    border-color: var(--line-dim);
    background:white;
  }
  .addHint{
    font-size:0.72rem;
    color:var(--muted);
    margin: -4px 0 12px;
  }
  .sinAsignarBtn{
    background:none;
    border:none;
    color: var(--zone-color, var(--line-dim));
    font-size:0.72rem;
    font-weight:700;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .dupWarn{
    display:flex;
    align-items:center;
    gap:6px;
    background:#fbeee0;
    color:#8a5a1c;
    border:1px solid #f0d5b3;
    border-radius:8px;
    padding:7px 10px;
    font-size:0.8rem;
    font-weight:600;
    margin: -4px 0 10px;
  }
  .dupWarn .dupWarnIcon{flex:0 0 auto; font-size:0.9rem;}
  .similarWarn{
    display:flex;
    align-items:flex-start;
    gap:6px;
    background:#f4f2fb;
    color:#5b4c96;
    border:1px solid #ded8f2;
    border-radius:8px;
    padding:7px 10px;
    font-size:0.78rem;
    font-weight:600;
    margin: -4px 0 10px;
  }
  .similarWarn .dupWarnIcon{flex:0 0 auto; font-size:0.9rem;}
  .similarWarn .similarList{ font-weight:500; }
  .similarWarn button{
    background:none; border:none; padding:0;
    color:inherit; font-weight:800; text-decoration:underline; cursor:pointer;
    font-size:inherit;
  }
  details.bulk{
    margin-bottom:14px;
  }
  details.bulk summary{
    cursor:pointer; font-size:0.82rem; color:var(--muted); font-weight:600;
    padding: 6px 0;
  }
  details.bulk .bulkHint{
    font-size:0.76rem; color:var(--muted); margin: 2px 0 6px;
  }
  details.bulk textarea{
    width:100%;
    min-height:80px;
    border-radius: var(--radius);
    border:1px solid #d7d8d3;
    padding:10px 12px;
    font-family: ui-monospace, monospace;
    font-size:0.85rem;
    resize:vertical;
  }
  details.bulk .bulkBtn{
    margin-top:6px;
    background: var(--zone-color);
    color:white;
    border:none;
    padding:8px 14px;
    border-radius: var(--radius);
    font-weight:700;
    cursor:pointer;
    font-size:0.82rem;
  }
  .campoList{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .campoCard{
    background:white;
    border-radius: var(--radius);
    padding: 10px 12px;
    display:flex;
    align-items:flex-start;
    gap:10px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .campoNum{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:38px;
    height:26px;
    padding:0 8px;
    border-radius:6px;
    background: var(--zone-color);
    color:white;
    font-weight:800;
    font-size:0.78rem;
    flex: 0 0 auto;
    margin-top:2px;
  }
  .campoBody{flex:1; min-width:0;}
  .campoCapBadge{
    display:inline-block;
    font-size:0.66rem;
    font-weight:700;
    color:var(--muted);
    background:#eceee9;
    border-radius:5px;
    padding:1px 6px;
    margin-bottom:4px;
  }
  .campoCapBadge.overCap{
    color:white;
    background: var(--danger);
  }
  .plateChips{
    display:flex; flex-wrap:wrap; gap:6px;
    align-items:flex-start;
  }
  .plateChip{
    display:flex; flex-direction:column;
    background:#eceee9;
    border-radius: 7px;
    padding: 5px 4px 6px 10px;
    font-size:0.85rem;
    cursor:pointer;
    border-left: 3px solid transparent;
  }
  .plateChip:active{background:#e0e1dc;}
  .plateChip.updatedToday{
    background: #e3f3ea;
    border-left: 3px solid #2f9e5e;
  }
  .plateChip.updatedToday:active{ background:#d3ebdc; }
  .updatedTodayTag{
    font-size:0.62rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:0.02em;
    color:white;
    background:#2f9e5e;
    border-radius:5px;
    padding:2px 6px;
  }
  .plateChipMain{
    display:flex; align-items:center; gap:6px;
  }
  .plateChip .plateText{
    min-width: 70px;
  }
  .aseguradoraText{
    font-size:0.68rem;
    color:var(--muted);
    font-weight:600;
    margin-top:2px;
    padding-left:2px;
    min-width:60px;
  }
  .aseguradoraText:empty::before{
    content: attr(data-placeholder);
    color:#b4b6b0;
    font-weight:500;
  }
  .orderBadge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:16px;
    height:16px;
    border-radius:50%;
    background:#d8d9d4;
    color:#5a5d61;
    font-size:0.62rem;
    font-weight:800;
    padding:0 3px;
  }
  .orderTag{
    font-size:0.62rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--muted);
    background:#e0e1dc;
    border-radius:5px;
    padding:2px 5px;
  }
  .orderTag.last{
    color:var(--asphalt);
    background: var(--line);
  }
  .campoNum{
    cursor:pointer;
  }
  .campoNum:active{opacity:0.8;}
  .campoNum.sinAsignar{
    background:transparent;
    border:1.5px dashed #b4b6b0;
    color:#6b6e72;
    font-weight:700;
    font-size:0.7rem;
  }
  .plateChip .chipRm{
    background:none; border:none; color:var(--danger);
    cursor:pointer; font-size:0.95rem; padding:2px 6px; line-height:1;
  }
  .orderMoveBtns{
    display:flex; flex-direction:column;
    line-height:0;
  }
  .orderMoveBtns button{
    background:none; border:none;
    color:var(--muted);
    cursor:pointer;
    font-size:0.6rem;
    padding:1px 3px;
    line-height:1;
  }
  .orderMoveBtns button:disabled{
    opacity:0.25;
    cursor:default;
  }
  .orderMoveBtns button:not(:disabled):active{color:var(--ink);}
  .addPlateToCampoBtn{
    background:none;
    border:1px dashed #c7c8c2;
    color:var(--muted);
    border-radius:7px;
    padding:5px 10px;
    font-size:0.8rem;
    cursor:pointer;
  }
  .campoDeleteBtn{
    background:none; border:none; color:var(--muted);
    cursor:pointer; font-size:1rem; padding:4px 6px; flex:0 0 auto;
  }
  .emptyState{
    text-align:center;
    color:var(--muted);
    padding: 30px 10px;
    font-size:0.85rem;
  }
  /* Resumen tab */
  .resumenToolbar{
    display:flex; gap:10px; margin-bottom:8px; flex-wrap:wrap;
    align-items:center;
    background:white;
    border-radius: var(--radius);
    padding:12px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    border:1px solid #eceee9;
  }
  .filterField{
    position:relative;
    flex:1;
    min-width:170px;
  }
  .filterField .filterIcon{
    position:absolute;
    left:11px; top:50%; transform:translateY(-50%);
    width:15px; height:15px;
    color:var(--muted);
    pointer-events:none;
  }
  .resumenToolbar input{
    width:100%;
    padding:9px 12px 9px 34px;
    border-radius:8px;
    border:1px solid #d7d8d3;
    background:#fbfbfa;
    font-size:0.9rem;
    transition: border-color 0.15s, background 0.15s;
  }
  .resumenToolbar input:focus{
    outline:none;
    border-color: var(--line-dim);
    background:white;
  }
  .selectField{ flex: 0 1 190px; min-width:150px; }
  .resumenToolbar select{
    width:100%;
    padding:9px 30px 9px 12px;
    border-radius:8px;
    border:1px solid #d7d8d3;
    background:#fbfbfa;
    font-size:0.9rem;
    appearance:none;
    -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%238b9198'><path d='M5.5 7.5l4.5 5 4.5-5z'/></svg>");
    background-repeat:no-repeat;
    background-position: right 8px center;
    background-size:16px;
    cursor:pointer;
  }
  .resumenToolbar select:focus{
    outline:none;
    border-color: var(--line-dim);
    background-color:white;
  }
  .clearFilterBtn{
    background:none;
    border:none;
    color:var(--muted);
    font-size:0.78rem;
    font-weight:600;
    text-decoration:underline;
    cursor:pointer;
    padding:6px 2px;
    white-space:nowrap;
  }
  .resultsCount{
    font-size:0.74rem;
    color:var(--muted);
    margin: 0 2px 12px;
  }
  .zoneChips{
    display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;
  }
  .dashboardGrid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap:10px;
    margin-bottom:18px;
  }
  .dashCard{
    background:white;
    border-radius: var(--radius);
    padding:14px 12px;
    text-align:center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .dashCard .dashCardValue{
    font-size:1.5rem;
    font-weight:800;
    color:var(--ink);
    line-height:1.1;
  }
  .dashCard .dashCardLabel{
    font-size:0.7rem;
    color:var(--muted);
    margin-top:4px;
    font-weight:600;
  }
  .chartCard{
    background:white;
    border-radius: var(--radius);
    padding:14px;
    margin-bottom:16px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  .chartCard h3{
    margin:0 0 12px;
    font-size:0.85rem;
    color:var(--ink);
  }
  .chartCanvasWrap{
    position:relative;
    height:220px;
  }
  .dashEmptyNote{
    font-size:0.78rem;
    color:var(--muted);
    text-align:center;
    padding:10px;
  }
  .capacityByZoneList{
    display:flex; flex-direction:column; gap:2px;
  }
  .capacityByZoneRow{
    display:flex; align-items:center; gap:8px;
    padding:9px 2px;
    border-bottom:1px solid #f0f1ed;
    font-size:0.85rem;
  }
  .capacityByZoneRow:last-child{ border-bottom:none; }
  .capacityByZoneName{ font-weight:600; }
  .capacityByZoneValue{ margin-left:auto; color:var(--muted); font-size:0.78rem; }
  .capacityByZoneRow .capacityEditBtn{
    background:none; border:none;
    color: var(--line-dim);
    font-weight:700; font-size:0.78rem;
    text-decoration:underline;
    cursor:pointer;
    flex:0 0 auto;
  }
  .chip{
    display:flex; align-items:center; gap:6px;
    padding:5px 10px;
    border-radius:999px;
    background:white;
    font-size:0.75rem;
    font-weight:600;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .chip .dot{width:8px;height:8px;border-radius:50%;}
  table{
    width:100%;
    border-collapse: collapse;
    background:white;
    border-radius: var(--radius);
    overflow:hidden;
  }
  thead th{
    text-align:left;
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.04em;
    color: var(--muted);
    padding:8px 10px;
    border-bottom:2px solid #eceee9;
  }
  tbody td{
    padding:9px 10px;
    border-bottom:1px solid #f0f1ed;
    font-size:0.92rem;
    vertical-align:top;
  }
  tbody tr:last-child td{border-bottom:none;}
  .resumenRow{cursor:pointer;}
  .resumenRow.updatedToday{ background:#e3f3ea; }
  .resumenRow.updatedToday:hover{ background:#d3ebdc; }
  .resumenRow:active{background:#f0f1ed;}
  .spotNum{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:30px;
    height:22px;
    padding:0 6px;
    border-radius:6px;
    color:white;
    font-weight:700;
    font-size:0.72rem;
  }
  .spotNum.sinAsignar{
    background:transparent !important;
    border:1.5px dashed #b4b6b0;
    color:#6b6e72;
  }
  .toast{
    position:fixed;
    bottom:16px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background: var(--ink);
    color:white;
    padding:10px 18px;
    border-radius: 14px;
    font-size:0.8rem;
    max-width: min(90vw, 420px);
    text-align:center;
    line-height:1.4;
    opacity:0;
    transition: all 0.25s ease;
    pointer-events:none;
    z-index:50;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  .modalOverlay{
    position:fixed; inset:0;
    background: rgba(27,30,33,0.55);
    display:none;
    align-items:center; justify-content:center;
    z-index:60;
    padding:20px;
  }
  .modalOverlay.show{display:flex;}
  .modalCard{
    background:white;
    border-radius: 14px;
    max-width: 360px;
    width:100%;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }
  .modalCard h3{margin:0 0 8px; font-size:1rem;}
  .modalCard p{margin:0 0 16px; font-size:0.88rem; color:var(--muted); line-height:1.4;}
  .modalCard .modalActions{display:flex; gap:8px; flex-direction:column;}
  .modalCard button{
    border:none; border-radius: var(--radius);
    padding:11px 14px; font-weight:700; font-size:0.88rem; cursor:pointer;
  }
  .modalCard .primaryBtn{background: var(--ink); color:white;}

  // checkStorageAvailable() se encarga de detectar si de verdad se puede
  // leer/escribir o no.
  function ensureFirebaseAuth(){
    return new Promise((resolve)=>{
      if(typeof firebase === "undefined"){
        fbReady = false;
        resolve();
        return;
      }
      try{
        firebase.initializeApp(firebaseConfig);
        fbDb = firebase.database();
      }catch(e){
        console.error("No se pudo inicializar Firebase", e);
        fbReady = false;
        resolve();
        return;
      }
      let settled = false;
      function finish(){
        if(settled) return;
        settled = true;
        fbReady = true; // la base de datos ya se puede intentar usar, con o sin sesión anónima
        resolve();
      }
      try{
        firebase.auth().onAuthStateChanged(()=> finish(), ()=> finish());
        firebase.auth().signInAnonymously().catch(()=> finish());
      }catch(e){ finish(); }
      setTimeout(finish, 4000); // no esperar más de 4s por la sesión anónima
    });
  }

        return { key, value: v, shared: false };
      }
      if(!fbReady) throw new Error("Firebase no está listo todavía");
      const snap = await fbDb.ref(key).once("value");
      if(!snap.exists()) throw new Error("Clave no encontrada: " + key);
      return { key, value: snap.val(), shared: true };
    },
    async set(key, value, shared){
      if(!shared){
        localStorage.setItem("inv_local_" + key, value);
        return { key, value, shared: false };
      }
      if(!fbReady) throw new Error("Firebase no está listo todavía");
      await fbDb.ref(key).set(value);
      return { key, value, shared: true };
    },
    async delete(key, shared){
      if(!shared){
        localStorage.removeItem("inv_local_" + key);
        return { key, deleted: true, shared: false };
      }
      if(!fbReady) throw new Error("Firebase no está listo todavía");

  // Reubica los vehículos de las antiguas zonas Avaluo/Atras/Malla dentro de

  // encaja en el rango numerado del bloque principal cae como "Sin asignar"
  // en su bloque hermano de capacidad (Puff / Sólidos / Sin numeración).
  function migrateAvaluoAtrasMallaToBlocks(oldAvaluo, oldAtras, oldMalla){
    const result = { Avaluo: [], AvaluoPuff: [], AtrasEntregas: [], Atras: [], AtrasSolidos: [], Maya: [], MayaSinNumeracion: [] };
    const lineCounters = { AvaluoPuff: 0, AtrasSolidos: 0, MayaSinNumeracion: 0 };

    function addPlates(zoneKey, campoLabel, plates){
      let entry = result[zoneKey].find(c => c.campo === campoLabel);
      if(!entry){ entry = { campo: campoLabel, plates: [] }; result[zoneKey].push(entry); }
      entry.plates.push(...plates);
    }
    // Cada campo viejo que no encaja en el rango numerado se convierte en su
    // propia "Línea" (conserva el orden que ya traían esos vehículos juntos,
    // en vez de mezclar todo en un solo cajón "Sin asignar").
    function addAsNewLine(zoneKey, plates){
      lineCounters[zoneKey]++;
      addPlates(zoneKey, `Línea ${lineCounters[zoneKey]}`, plates);
    }

    (oldAvaluo || []).forEach(c=>{
      const n = parseFloat(c.campo);
      if(!isNaN(n) && n>=1 && n<=31) addPlates("Avaluo", c.campo, c.plates);
      else addAsNewLine("AvaluoPuff", c.plates);
    });

    (oldAtras || []).forEach(c=>{
      const n = parseFloat(c.campo);
      if(!isNaN(n) && n>=33 && n<=36) addPlates("AtrasEntregas", c.campo, c.plates);
      else if(!isNaN(n) && n>=37 && n<=62) addPlates("Atras", c.campo, c.plates);
      else addAsNewLine("AtrasSolidos", c.plates);
    });

    (oldMalla || []).forEach(c=>{
      const n = parseFloat(c.campo);
      if(!isNaN(n) && ((n>=1 && n<=19) || (n>=71 && n<=76))) addPlates("Maya", c.campo, c.plates);
      else addAsNewLine("MayaSinNumeracion", c.plates);
    });

    Object.keys(result).forEach(k => sortCampos(result[k]));
    return result;

  // "Línea 1" — no se puede reconstruir la separación original ya perdida,
  // pero al menos queda organizado bajo el nuevo esquema de líneas.
  function migrateSinAsignarToLineas(st){
    let changed = false;
    UNNUMBERED_ONLY_ZONES.forEach(zoneKey=>{

  function migrateNumberedZonesToLines(st){
    let changed = false;
    ["Neon Nieto", "Parqueo Gash Externo"].forEach(zoneKey=>{
      const arr = st.zones[zoneKey];
      if(!arr || arr.length === 0) return;
      const yaSonLineas = arr.every(c => /^L[ií]nea\s+\d+$/i.test(c.campo));

        st.zones[zoneKey] = arr.map((c, idx) => ({ campo: `Línea ${idx+1}`, plates: c.plates }));

  function applyPerCampoCapacityImportIfNeeded(st){
    if((st.perCampoCapacityVersion || 0) >= PER_CAMPO_CAPACITY_VERSION) return false;

      if(!st.zones[zoneKey]) st.zones[zoneKey] = [];

  const STORAGE_KEY = "inventario_parqueo_v4";

  // ¿Se actualizó (movió, editó o registró) este vehículo hoy? Sirve para
  // resaltar en la interfaz "ya pasé por esta placa" durante una ronda.
  function wasUpdatedToday(entry){
    if(!entry || !entry.lastUpdated) return false;
    const d = new Date(entry.lastUpdated);
    if(isNaN(d.getTime())) return false;
    const now = new Date();
    return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  }
  function normalizeCampo(v){ return String(v).trim(); }

  const SIN_ASIGNAR = "Sin asignar";

  // bajo "Sin asignar", así que su ocupación se mide por vehículos totales,
  // no por cantidad de campos numerados (que siempre sería cero).
  const UNNUMBERED_ONLY_ZONES = new Set(["AvaluoPuff", "AtrasSolidos", "MayaSinNumeracion", "Neon Nieto", "Parqueo Gash Externo"]);
  function occupancyCountForZone(zoneKey){
    const campos = state.zones[zoneKey] || [];
    if(UNNUMBERED_ONLY_ZONES.has(zoneKey)){
      return campos.reduce((a,c)=>a+c.plates.length, 0);
    }
    return campos.filter(c => c.campo !== SIN_ASIGNAR).length;

  function campoSortValue(c){
    const n = parseFloat(c);
    if(!isNaN(n)) return n;
    const m = /^L[ií]nea\s+(\d+)$/i.exec(String(c).trim());
    if(m) return 1000000 + parseInt(m[1], 10); // Líneas: después de los números, pero en orden numérico entre sí
    return Infinity;
  }
  function sortCampos(arr){
    arr.sort((a,b)=>{
      if(a.campo === SIN_ASIGNAR && b.campo !== SIN_ASIGNAR) return 1;
      if(b.campo === SIN_ASIGNAR && a.campo !== SIN_ASIGNAR) return -1;
      const av = campoSortValue(a.campo), bv = campoSortValue(b.campo);
      if(av !== bv) return av - bv;
      return String(a.campo).localeCompare(String(b.campo));
    });
  }

  function rawSeedToCampoArray(rawObj){
    const arr = Object.keys(rawObj || {}).map(campo => ({

  function seedZonesFromScratch(){
    const zones = {};

    // Avalúo / Atrás / Malla (datos originales del Excel) se reparten entre
    // los 7 bloques nuevos usando la misma migración que se aplica a datos
    // ya existentes, para que una instalación nueva también quede correcta.
    const oldAvaluo = rawSeedToCampoArray(SEED_DATA["Avaluo"]);
    const oldAtras = rawSeedToCampoArray(SEED_DATA["Atras"]);
    const oldMalla = rawSeedToCampoArray(SEED_DATA["Malla"]);
    Object.assign(zones, migrateAvaluoAtrasMallaToBlocks(oldAvaluo, oldAtras, oldMalla));

    // Neon Nieto y Parqueo Gash Externo no tienen numeración física real:
    // cada campo del Excel original se convierte en su propia línea.
    ["Neon Nieto", "Parqueo Gash Externo"].forEach(key=>{
      const raw = rawSeedToCampoArray(SEED_DATA[key]);
      zones[key] = raw.map((c, idx) => ({ campo: `Línea ${idx+1}`, plates: c.plates }));
    });

    return zones;
  }

  // Convierte el formato plano de la versión anterior (lista de placas por
  // zona) al modelo de campos, asignando un campo secuencial a cada placa.
  function migrateFlatToCampos(flatZones){
    const zones = {};
    ZONES.forEach(z=>{
      const list = flatZones[z.key] || [];
      zones[z.key] = list.map((plate, idx) => ({ campo: String(idx+1), plates: [{ plate, aseguradora: "" }] }));
    });
    return zones;
  }

  // Convierte campos cuyas placas todavía sean strings (formato v3, sin
  // aseguradora) al modelo de objetos {plate, aseguradora}.
  function migrateCamposToPlateObjects(zones){
    ZONES.forEach(z=>{
      const arr = zones[z.key] || [];
      arr.forEach(c=>{
        c.plates = (c.plates || []).map(p => (typeof p === "string") ? { plate: p, aseguradora: "" } : p);
      });
    });
    return zones;
  }

  function showToast(msg, duration){
    const t = document.getElementById("toast");
    t.textContent = msg || "Guardado";
    t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(()=> t.classList.remove("show"), duration || 1600);
  }

  function showStorageBanner(){
    if(document.getElementById("storageBanner")) return;
    const b = document.createElement("div");
    b.id = "storageBanner";
    b.style.cssText = "background:#3a2a12;color:#f2c230;font-size:0.78rem;padding:8px 16px;text-align:center;";
    b.textContent = "No se pudo activar el guardado automático en este navegador — los cambios se mantienen mientras la pestaña esté abierta. Exportá a Excel antes de cerrar para no perder nada.";

  async function checkStorageAvailable(){
    if(!window.storage || typeof window.storage.set !== "function" || typeof window.storage.get !== "function"){
      return false;
    }
    try{
      const probe = await window.storage.set("__probe__", "1", true);
      if(!probe || typeof probe !== "object") return false;
      return true;
    }catch(e){
      return false;
    }
  }

  // Si el estado cargado todavía tiene la clave "Malla" (formato anterior a
  // los 7 bloques), reubica Avalúo/Atrás/Malla en los bloques nuevos según
  // su número de campo y aplica las capacidades por defecto de los bloques
  // sin numeración. Devuelve true si hizo falta migrar (para re-guardar).
  function migrateStateToBlocksIfNeeded(st){
    if(st.zones && st.zones.Malla !== undefined){
      // Por si alguna placa llegó aquí todavía como texto simple (formatos muy antiguos)
      ["Avaluo","Atras","Malla"].forEach(k=>{
        (st.zones[k]||[]).forEach(c=>{
          c.plates = (c.plates||[]).map(p => (typeof p === "string") ? { plate: p, aseguradora: "" } : p);
        });
      });
      const migrated = migrateAvaluoAtrasMallaToBlocks(st.zones.Avaluo, st.zones.Atras, st.zones.Malla);
      delete st.zones.Avaluo;
      delete st.zones.Atras;
      delete st.zones.Malla;
      Object.assign(st.zones, migrated);
      st.capacities = applyDefaultBlockCapacities(st.capacities || {});
      return true;
    }
    return false;
  }

  async function loadState(){
    // storageAvailable ya fue calculado por runAuthGate() al arrancar la app,
    // antes de que revealApp() invoque esta función; se reutiliza en vez de
    // repetir la verificación (evita una escritura de "sonda" extra).

    if(storageAvailable){
      // 1) dato compartido ya en el formato actual (v4, con aseguradora)
      try{
        const shared = await window.storage.get(STORAGE_KEY, true);
        if(shared && shared.value){
          state = JSON.parse(shared.value);
          if(!state.capacities) state.capacities = {};
          let needsResave = migrateStateToBlocksIfNeeded(state);
          needsResave = migrateSinAsignarToLineas(state) || needsResave;
          needsResave = migrateNumberedZonesToLines(state) || needsResave;
          needsResave = applyPerCampoCapacityImportIfNeeded(state) || needsResave;
          if(needsResave) await saveState(true);
          return;
        }
      }catch(e){ /* no existe todavía */ }

      // 1b) versión anterior (v3: campos con placas como texto simple, sin aseguradora) -> migrar
      try{
        const legacyCampos = await window.storage.get(LEGACY_CAMPOS_KEY, true);
        if(legacyCampos && legacyCampos.value){
          const old = JSON.parse(legacyCampos.value);
          state = {
            zones: migrateCamposToPlateObjects(old.zones || {}),
            capacities: old.capacities || {},
            updatedAt: new Date().toISOString()
          };
          migrateStateToBlocksIfNeeded(state);
          migrateSinAsignarToLineas(state);
          migrateNumberedZonesToLines(state);
          applyPerCampoCapacityImportIfNeeded(state);
          await saveState(true);
          return;
        }
      }catch(e){ /* nada */ }

      // 2) versión anterior (lista plana) guardada como compartida -> migrar
      try{
        const legacyShared = await window.storage.get(LEGACY_FLAT_KEY, true);
        if(legacyShared && legacyShared.value){
          const old = JSON.parse(legacyShared.value);
          state = { zones: migrateFlatToCampos(old.zones || {}), capacities: applyDefaultBlockCapacities({}), updatedAt: new Date().toISOString() };
          await saveState(true);
          return;
        }
      }catch(e){ /* nada */ }

      // 3) versión anterior guardada en modo personal -> migrar también
      try{
        const legacyPersonal = await window.storage.get(LEGACY_FLAT_KEY, false);
        if(legacyPersonal && legacyPersonal.value){
          const old = JSON.parse(legacyPersonal.value);
          state = { zones: migrateFlatToCampos(old.zones || {}), capacities: applyDefaultBlockCapacities({}), updatedAt: new Date().toISOString() };
          await saveState(true);
          return;
        }
      }catch(e){ /* nada */ }
    }

    // primera vez, o sin almacenamiento disponible: sembrar con los datos reales del Excel
    state = { zones: seedZonesFromScratch(), capacities: applyDefaultBlockCapacities({}), updatedAt: new Date().toISOString() };
    applyPerCampoCapacityImportIfNeeded(state);
    await saveState(true);
  }

  async function saveState(silent){
    state.updatedAt = new Date().toISOString();

    if(!storageAvailable){
      if(!storageWarned){ storageWarned = true; showStorageBanner(); }
      renderMeta();
      return;
    }

    try{
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
      if(!result || typeof result !== "object"){
        throw new Error("Unexpected response type");
      }
      if(!silent) showToast("Guardado");
    }catch(e){
      console.error("Error guardando", e);
      storageAvailable = false;
      if(!storageWarned){ storageWarned = true; showStorageBanner(); }
    }
    renderMeta();
  }

  function renderMeta(){
    let totalVeh = 0, totalCampos = 0;

    document.getElementById("metaLine").textContent = `${totalVeh} vehículos en ${totalCampos} campos · actualizado ${fecha}, ${hora}`;

  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // Busca una placa en todas las zonas/campos. Devuelve {zoneKey, campoIdx, plateIdx} o null.
  function findPlate(plateUpper, excludeZone, excludeCampoIdx, excludePlateIdx){
    for(const z of ZONES){
      const arr = state.zones[z.key] || [];
      for(let ci=0; ci<arr.length; ci++){
        const plates = arr[ci].plates;
        for(let pi=0; pi<plates.length; pi++){
          if(z.key===excludeZone && ci===excludeCampoIdx && pi===excludePlateIdx) continue;
          if((plates[pi].plate||"").toUpperCase() === plateUpper){
            return { zoneKey: z.key, campoIdx: ci, plateIdx: pi };
          }
        }
      }
    }
    return null;
  }

  // Distancia de edición simple (Levenshtein), para detectar placas parecidas
  // (posible error de tipeo) sin que sean un duplicado exacto.
  function levenshteinDistance(a, b){
    const m = a.length, n = b.length;
    const dp = Array.from({length: m+1}, ()=> new Array(n+1).fill(0));
    for(let i=0;i<=m;i++) dp[i][0] = i;
    for(let j=0;j<=n;j++) dp[0][j] = j;
    for(let i=1;i<=m;i++){
      for(let j=1;j<=n;j++){
        dp[i][j] = (a[i-1]===b[j-1]) ? dp[i-1][j-1]
          : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
      }
    }
    return dp[m][n];
  }

  // Busca placas ya existentes MUY parecidas (pero no iguales) a `plateUpper`.
  // Solo tiene sentido con placas de al menos 4 caracteres, para evitar
  // falsos positivos mientras la persona recién empieza a escribir.
  function findSimilarPlates(plateUpper, excludeZone, excludeCampoIdx, excludePlateIdx){
    if(!plateUpper || plateUpper.length < 4) return [];
    const results = [];
    for(const z of ZONES){
      const arr = state.zones[z.key] || [];
      for(let ci=0; ci<arr.length; ci++){
        const plates = arr[ci].plates;
        for(let pi=0; pi<plates.length; pi++){
          if(z.key===excludeZone && ci===excludeCampoIdx && pi===excludePlateIdx) continue;
          const existing = (plates[pi].plate || "").toUpperCase();
          if(!existing || existing === plateUpper) continue;
          const threshold = existing.length <= 6 ? 1 : 2;
          const dist = levenshteinDistance(plateUpper, existing);
          if(dist > 0 && dist <= threshold){
            results.push({ zoneKey: z.key, campoIdx: ci, plateIdx: pi, plate: existing, distance: dist });
          }
        }
      }
    }
    results.sort((a,b)=> a.distance - b.distance);
    return results.slice(0, 3);
  }

  function askMoveOrCancel(plate, fromZoneLabel, fromCampo, toZoneLabel, toCampo){
    return new Promise((resolve)=>{
      const overlay = document.getElementById("dupModal");
      const msg = document.getElementById("dupModalMsg");
      msg.textContent = `${plate} ya está registrada en ${fromZoneLabel}, campo ${fromCampo}. ¿Se movió a ${toZoneLabel} (campo ${toCampo}), o fue un error al escribir la placa?`;
      overlay.classList.add("show");
      const moveBtn = document.getElementById("dupModalMove");
      const cancelBtn = document.getElementById("dupModalCancel");
      function cleanup(result){
        overlay.classList.remove("show");
        moveBtn.removeEventListener("click", onMove);
        cancelBtn.removeEventListener("click", onCancel);
        resolve(result);
      }
      function onMove(){ cleanup("move"); }
      function onCancel(){ cleanup("cancel"); }
      moveBtn.addEventListener("click", onMove);
      cancelBtn.addEventListener("click", onCancel);
    });
  }

  // Quita una placa de donde esté (por índice) y limpia el campo si queda vacío.
  function removePlateAt(zoneKey, campoIdx, plateIdx){
    const arr = state.zones[zoneKey];
    arr[campoIdx].plates.splice(plateIdx, 1);
    if(arr[campoIdx].plates.length === 0){
      arr.splice(campoIdx, 1);
    }
  }

  // Modal para editar la zona y el campo donde está una placa, abierto
  // desde una fila del Resumen (filtro por placa).
  // Quita una entrada de placa por identidad de objeto (evita bugs de
  // índices desfasados cuando se remueven dos placas en la misma operación).
  function removePlateEntryByRef(zoneKey, campoObj, entryObj){
    const idx = campoObj.plates.indexOf(entryObj);
    if(idx === -1) return;
    campoObj.plates.splice(idx, 1);
    if(campoObj.plates.length === 0){
      const arr = state.zones[zoneKey];
      const cIdx = arr.indexOf(campoObj);
      if(cIdx !== -1) arr.splice(cIdx, 1);
    }
  }

  // Vista de solo lectura para el rol Búsqueda: muestra el detalle del
  // vehículo y permite copiar la info, sin ninguna posibilidad de editar.
  function openViewDetailModal(zoneKey, ci, pi){
    const arr = state.zones[zoneKey];
    if(!arr || !arr[ci] || pi >= arr[ci].plates.length){
      showToast("Esa placa ya cambió de lugar, actualizá la búsqueda");
      return;
    }
    const campoObj = arr[ci];
    const entry = campoObj.plates[pi];
    const zi = zoneInfo(zoneKey);

    const overlay = document.getElementById("viewDetailModal");
    const body = document.getElementById("viewDetailBody");
    body.innerHTML = `
      <div class="updaterInfoRow"><span>Placa</span><strong>${escapeHtml(entry.plate)}</strong></div>
      <div class="updaterInfoRow"><span>Zona</span><strong>${zi.label}</strong></div>
      <div class="updaterInfoRow"><span>Campo</span><strong>${escapeHtml(campoObj.campo)}</strong></div>
      <div class="updaterInfoRow"><span>Aseguradora</span><strong>${entry.aseguradora ? escapeHtml(entry.aseguradora) : "—"}</strong></div>
      <div class="updaterInfoRow"><span>Modelo</span><strong>${entry.modelo ? escapeHtml(entry.modelo) : "—"}</strong></div>
    `;
    overlay.classList.add("show");

    const copyBtn = document.getElementById("viewDetailCopyBtn");
    const closeBtn = document.getElementById("viewDetailCloseBtn");
    async function onCopy(){
      const text = `Placa: ${entry.plate}\nZona: ${zi.label}\nCampo: ${campoObj.campo}\nAseguradora: ${entry.aseguradora || "—"}\nModelo: ${entry.modelo || "—"}`;
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          document.execCommand("copy");
          document.body.removeChild(ta);
        }
        showToast("Info copiada al portapapeles");
      }catch(e){
        showToast("No se pudo copiar. Copiá el texto manualmente.");
      }
    }
    function onClose(){
      overlay.classList.remove("show");
      copyBtn.removeEventListener("click", onCopy);
      closeBtn.removeEventListener("click", onClose);
    }
    copyBtn.addEventListener("click", onCopy);
    closeBtn.addEventListener("click", onClose);
  }

  function openEditLocModal(zoneKey, ci, pi){
    if(!guardEdit()) return;
    const arr = state.zones[zoneKey];
    if(!arr || !arr[ci] || pi >= arr[ci].plates.length){
      showToast("Esa placa ya cambió de lugar, actualizá la búsqueda");
      return;
    }
    const targetCampoObj = arr[ci];
    const targetEntry = targetCampoObj.plates[pi];
    const plate = targetEntry.plate;
    const currentCampo = targetCampoObj.campo;

    const overlay = document.getElementById("editLocModal");
    const sub = document.getElementById("editLocSub");
    const placaInput = document.getElementById("editLocPlaca");
    const zoneSelect = document.getElementById("editLocZone");
    const campoInput = document.getElementById("editLocCampo");
    const aseguradoraInput = document.getElementById("editLocAseguradora");
    const modeloInput = document.getElementById("editLocModelo");
    const saveBtn = document.getElementById("editLocSave");
    const cancelBtn = document.getElementById("editLocCancel");
    const deleteBtn = document.getElementById("editLocDelete");
    const sinAsignarBtn = document.getElementById("editLocSinAsignarBtn");

    sub.textContent = `Actualmente en ${zoneInfo(zoneKey).label}, campo ${currentCampo}`;
    placaInput.value = plate;
    zoneSelect.innerHTML = ZONES.map(z=>`<option value="${z.key}" ${z.key===zoneKey?"selected":""}>${z.label}</option>`).join("");
    campoInput.value = currentCampo;
    aseguradoraInput.value = targetEntry.aseguradora || "";
    modeloInput.value = targetEntry.modelo || "";

    overlay.classList.add("show");

    function onEnterKey(e){ if(e.key === "Enter") onSave(); }
    [placaInput, campoInput, aseguradoraInput, modeloInput].forEach(inp=> inp.addEventListener("keydown", onEnterKey));

    function cleanup(){
      overlay.classList.remove("show");
      saveBtn.removeEventListener("click", onSave);
      cancelBtn.removeEventListener("click", onCancel);
      deleteBtn.removeEventListener("click", onDelete);
      sinAsignarBtn.removeEventListener("click", onSinAsignar);
      [placaInput, campoInput, aseguradoraInput, modeloInput].forEach(inp=> inp.removeEventListener("keydown", onEnterKey));
    }
    function onCancel(){ cleanup(); }
    function onSinAsignar(){ campoInput.value = SIN_ASIGNAR; campoInput.focus(); }
    async function onSave(){
      const newZone = zoneSelect.value;
      const newCampo = normalizeCampo(campoInput.value);
      const newPlate = normalizePlate(placaInput.value);
      const newAseguradora = aseguradoraInput.value.trim();
      const newModelo = modeloInput.value.trim();
      if(!newCampo){ showToast("Ingresá un campo válido"); return; }
      if(!newPlate){ showToast("Ingresá una placa válida"); return; }

      const sameLocation = (newZone === zoneKey && newCampo === currentCampo);
      const samePlate = (newPlate === normalizePlate(plate));

      // Caso simple: no cambia ni la ubicación ni la placa -> solo actualizar
      // la aseguradora en el mismo lugar, sin tocar el orden de llegada.
      if(sameLocation && samePlate){
        if(newAseguradora === (targetEntry.aseguradora || "") && newModelo === (targetEntry.modelo || "")){ cleanup(); return; }
        const snap = snapshotZones();
        targetEntry.aseguradora = newAseguradora;
        targetEntry.modelo = newModelo;
        targetEntry.lastUpdated = new Date().toISOString();
        pushUndo(snap);
        cleanup();
        await saveState();
        renderAll();
        return;
      }

      // Si la placa cambió (o se mueve), verificar que no choque con otra
      // placa existente en cualquier otro lugar del inventario.
      if(!samePlate){
        const dup = findPlate(newPlate, zoneKey, ci, pi);
        if(dup){
          const dupInfo = zoneInfo(dup.zoneKey);
          const dupCampoObj = state.zones[dup.zoneKey][dup.campoIdx];
          const dupEntry = dupCampoObj.plates[dup.plateIdx];
          const choice = await askMoveOrCancel(newPlate, dupInfo.label, dupCampoObj.campo, zoneInfo(newZone).label, newCampo);
          if(choice !== "move") return;
          const snap = snapshotZones();
          removePlateEntryByRef(dup.zoneKey, dupCampoObj, dupEntry);
          removePlateEntryByRef(zoneKey, targetCampoObj, targetEntry);
          getOrCreateCampo(newZone, newCampo).plates.push({ plate: newPlate, aseguradora: newAseguradora, modelo: newModelo, lastUpdated: new Date().toISOString() });
          pushUndo(snap);
          cleanup();
          await saveState();
          await logUpdate(newPlate, zoneKey, currentCampo, newZone, newCampo);
          pendingResumenFilter = newPlate;
          renderAll();
          return;
        }
      } else if(!sameLocation) {
        // misma placa, solo cambia de ubicación: verificar que el destino
        // no tenga ya esta placa (caso raro, por seguridad).
        const destArr = state.zones[newZone];
        const destCampo = destArr.find(c => c.campo === newCampo);
        if(destCampo && destCampo.plates.some(p => p.plate.toUpperCase() === newPlate.toUpperCase())){
          showToast(`${newPlate} ya está en ${zoneInfo(newZone).label}, campo ${newCampo}`);
          return;
        }
      }

      const snap = snapshotZones();
      removePlateEntryByRef(zoneKey, targetCampoObj, targetEntry);
      getOrCreateCampo(newZone, newCampo).plates.push({ plate: newPlate, aseguradora: newAseguradora, modelo: newModelo, lastUpdated: new Date().toISOString() });
      pushUndo(snap);
      cleanup();
      await saveState();
      if(!sameLocation){
        await logUpdate(newPlate, zoneKey, currentCampo, newZone, newCampo);
      }
      pendingResumenFilter = newPlate;
      renderAll();
    }
    async function onDelete(){
      if(!confirm(`¿Eliminar ${plate} del inventario?`)) return;
      const snap = snapshotZones();
      removePlateEntryByRef(zoneKey, targetCampoObj, targetEntry);
      pushUndo(snap);
      cleanup();
      await saveState();
      renderAll();
    }
    saveBtn.addEventListener("click", onSave);
    cancelBtn.addEventListener("click", onCancel);
    deleteBtn.addEventListener("click", onDelete);
    sinAsignarBtn.addEventListener("click", onSinAsignar);
  }

  function getOrCreateCampo(zoneKey, campoLabel){
    const arr = state.zones[zoneKey];
    let entry = arr.find(c => c.campo === campoLabel);
    if(!entry){
      entry = { campo: campoLabel, plates: [] };
      arr.push(entry);
      sortCampos(arr);
    }
    return entry;
  }

  // Inserta una placa en un campo/línea ya existente en la posición elegida:
  // "first" (antes de todas), "middle" (a la mitad), "last" (al final, default).
  function insertPlateAtPosition(campoObj, entry, position){
    if(position === "first"){
      campoObj.plates.unshift(entry);
    } else if(position === "middle"){
      const idx = Math.ceil(campoObj.plates.length / 2);
      campoObj.plates.splice(idx, 0, entry);
    } else {
      campoObj.plates.push(entry);
    }
  }

  function nextAutoCampo(zoneKey){
    const arr = state.zones[zoneKey];
    let max = 0;
    arr.forEach(c=>{ const n = parseInt(c.campo,10); if(!isNaN(n) && n>max) max = n; });
    return String(max+1);
  }

  // Para las 3 zonas sin numeración física: siguiente "Línea N" disponible,
  // en vez de un número de espacio (que ahí no existe).
  function nextLineLabel(zoneKey){
    const arr = state.zones[zoneKey] || [];
    let max = 0;
    arr.forEach(c=>{
      const m = /^L[ií]nea\s+(\d+)$/i.exec(c.campo);
      if(m){ const n = parseInt(m[1],10); if(n>max) max = n; }
    });
    return `Línea ${max+1}`;
  }

  // Campos/líneas que ya tienen al menos un vehículo en esta zona (ordenados),
  // para sugerirlos como opciones rápidas al elegir dónde ubicar una placa.
  function getExistingCamposForZone(zoneKey){
    return (state.zones[zoneKey] || []).map(c => c.campo);
  }

  // ¿Cuántos vehículos hay ya en ese campo/línea de esa zona? (0 si no existe todavía)
  function countPlatesInCampo(zoneKey, campoLabel){
    const arr = state.zones[zoneKey] || [];
    const entry = arr.find(c => c.campo === campoLabel);
    return entry ? entry.plates.length : 0;
  }

  // Intenta agregar `plate` al `campoLabel` de `zoneKey`. Maneja duplicados
  // preguntando si se debe mover. Devuelve true si finalmente se agregó.
  async function addPlateToZone(zoneKey, campoLabel, plateRaw, aseguradoraRaw, modeloRaw, position){
    const plate = normalizePlate(plateRaw);
    if(!plate) return false;
    const aseguradora = (aseguradoraRaw || "").trim();
    const modelo = (modeloRaw || "").trim();
    const info = zoneInfo(zoneKey);
    const campo = campoLabel ? normalizeCampo(campoLabel)
      : (UNNUMBERED_ONLY_ZONES.has(zoneKey) ? nextLineLabel(zoneKey) : nextAutoCampo(zoneKey));

    const dup = findPlate(plate);
    if(dup){
      if(dup.zoneKey === zoneKey && state.zones[zoneKey][dup.campoIdx].campo === campo){
        showToast(`${plate} ya está en el campo ${campo} de esta zona`);
        return false;
      }
      const dupInfo = zoneInfo(dup.zoneKey);
      const dupCampo = state.zones[dup.zoneKey][dup.campoIdx].campo;
      const choice = await askMoveOrCancel(plate, dupInfo.label, dupCampo, info.label, campo);
      if(choice !== "move") return false;
      removePlateAt(dup.zoneKey, dup.campoIdx, dup.plateIdx);
    }

    insertPlateAtPosition(getOrCreateCampo(zoneKey, campo), { plate, aseguradora, modelo, lastUpdated: new Date().toISOString() }, position || "last");
    return true;
  }

  function occupancyHtml(zoneKey, campoCount, color){
    const cap = state.capacities[zoneKey];
    if(cap && cap > 0){
      const pct = Math.min(100, Math.round((campoCount / cap) * 100));
      return `
        <div class="occupancyRow">
          <div class="occupancyBar"><div class="occupancyBarFill" style="width:${pct}%; background:${color};"></div></div>
          <span class="occupancyText">${campoCount}/${cap} campos (${pct}%)</span>
          <button class="capacityEditBtn">editar</button>
        </div>
      `;
    }
    return `
      <div class="occupancyRow">
        <span class="occupancyText">${campoCount} campo(s) ocupados</span>
        <button class="capacityEditBtn">definir capacidad</button>
      </div>
    `;
  }

  function renderZonePanel(zone){
    const info = zoneInfo(zone.key);
    const campos = state.zones[zone.key] || [];
    const totalVeh = campos.reduce((a,c)=>a+c.plates.length,0);
    const wrap = document.createElement("div");
    wrap.className = "zonePanel active";
    wrap.style.setProperty("--zone-color", info.color);

    if(!canEdit()){
      wrap.innerHTML = `<div class="dashEmptyNote">Tu usuario no tiene acceso a esta sección.</div>`;
      document.getElementById("mainArea").appendChild(wrap);
      return wrap;
    }

    wrap.innerHTML = `
      <div class="zoneHeadCard">
        <h2>${info.label}</h2>
        <div class="sub">${totalVeh} vehículo(s) en ${campos.length} campo(s)</div>
        ${occupancyHtml(zone.key, occupancyCountForZone(zone.key), info.color)}
      </div>
      <div class="addRow">
        <input type="text" id="campoInput_${info.abbr}" class="campoInput" placeholder="${UNNUMBERED_ONLY_ZONES.has(zone.key) ? "Línea" : "Campo"}">
        <input type="text" id="addInput_${info.abbr}" class="plate plateInputAdd" placeholder="Placa">
        <button id="addBtn_${info.abbr}">Agregar</button>
      </div>
      <div class="addRowSecondary">
        <input type="text" id="aseguradoraInput_${info.abbr}" placeholder="Aseguradora (opcional)">
        <input type="text" id="modeloInput_${info.abbr}" placeholder="Modelo (opcional)">
      </div>
      <div class="dupWarn" id="dupWarn_${info.abbr}" style="display:none;"></div>
      <div class="similarWarn" id="similarWarn_${info.abbr}" style="display:none;"></div>
      <div class="addHint">${UNNUMBERED_ONLY_ZONES.has(zone.key)
        ? `Dejá "Línea" vacío para asignar la siguiente disponible (Línea 1, Línea 2…). Si ya existe, la placa se suma a las que ya tiene esa línea.`
        : `Dejá "Campo" vacío para asignar el siguiente número disponible, o <button type="button" class="sinAsignarBtn" id="sinAsignarBtn_${info.abbr}">marcá como sin asignar</button>. Si el campo ya existe, la placa se suma a las que ya tiene.`
      }</div>
      <details class="bulk">
        <summary>Pegar varias placas a la vez</summary>
        <div class="bulkHint">Una por línea, formato "campo placa" (ej: 42 CL338850). Si solo ponés la placa, se le asigna un campo nuevo. La aseguradora se agrega después, editando cada placa.</div>
        <textarea id="bulkArea_${info.abbr}" placeholder="42 CL338850&#10;42 BQZ203&#10;AAA758"></textarea>
        <button class="bulkBtn" id="bulkBtn_${info.abbr}">Agregar todas</button>
      </details>
      <div class="campoList" id="campoList_${info.abbr}"></div>
      <div id="empty_${info.abbr}"></div>
    `;

    document.getElementById("mainArea").appendChild(wrap);

    wrap.querySelector(".capacityEditBtn").addEventListener("click", ()=>{
      const current = state.capacities[zone.key] || "";
      const input = prompt(`Capacidad total de espacios en ${info.label} (dejá vacío para quitarla):`, current);
      if(input === null) return;
      const trimmed = input.trim();
      if(trimmed === ""){
        delete state.capacities[zone.key];
      } else {
        const n = parseInt(trimmed, 10);
        if(isNaN(n) || n <= 0){ showToast("Ingresá un número válido"); return; }
        state.capacities[zone.key] = n;
      }
      saveState();
      renderAll();
    });


    const list = wrap.querySelector(`#campoList_${info.abbr}`);
    if(campos.length === 0){
      wrap.querySelector(`#empty_${info.abbr}`).innerHTML = `<div class="emptyState">Sin vehículos registrados en esta zona todavía.</div>`;
    } else {
      campos.forEach((c, ci)=>{
        const card = document.createElement("div");
        card.className = "campoCard";
        const isSinAsignar = c.campo === SIN_ASIGNAR;
        const hasCap = typeof c.capacidad === "number" && c.capacidad > 0;
        const overCap = hasCap && c.plates.length > c.capacidad;
        card.innerHTML = `
          <span class="campoNum${isSinAsignar ? " sinAsignar" : ""}" ${isSinAsignar ? "" : `style="background:${info.color}"`} data-ci="${ci}" title="Tocá para renombrar el campo">${escapeHtml(c.campo)}</span>
          <div class="campoBody">
            ${hasCap ? `<div class="campoCapBadge${overCap ? " overCap" : ""}" title="Capacidad de este espacio">${c.plates.length}/${c.capacidad} vehíc.</div>` : ``}
            <div class="plateChips" data-ci="${ci}"></div>
          </div>
          <button class="campoDeleteBtn" data-ci="${ci}" title="Eliminar campo completo">✕</button>
        `;
        const chipsWrap = card.querySelector(".plateChips");
        c.plates.forEach((entry, pi)=>{
          const chip = document.createElement("span");
          chip.className = "plateChip" + (wasUpdatedToday(entry) ? " updatedToday" : "");
          chip.dataset.ci = ci;
          chip.dataset.pi = pi;
          chip.title = "Tocá para editar placa, campo, zona o aseguradora";
          const isFirst = pi === 0;
          const isLast = pi === c.plates.length - 1 && c.plates.length > 1;
          const multi = c.plates.length > 1;
          chip.innerHTML = `
            <div class="plateChipMain">
              ${multi ? `<span class="orderMoveBtns">
                <button class="orderUp" data-ci="${ci}" data-pi="${pi}" title="Mover antes" ${isFirst ? "disabled" : ""}>▲</button>
                <button class="orderDown" data-ci="${ci}" data-pi="${pi}" title="Mover después" ${isLast ? "disabled" : ""}>▼</button>
              </span>` : ``}
              <span class="orderBadge" title="Orden de llegada">${pi+1}</span>
              <span class="plateText plate">${escapeHtml(entry.plate)}</span>
              ${isFirst ? '<span class="orderTag">primero</span>' : ''}
              ${isLast ? '<span class="orderTag last">último</span>' : ''}
              ${wasUpdatedToday(entry) ? '<span class="updatedTodayTag" title="Se actualizó hoy">✓ hoy</span>' : ''}
              <button class="chipRm" data-ci="${ci}" data-pi="${pi}" title="Eliminar rápido">✕</button>
            </div>
            <div class="aseguradoraText" data-placeholder="sin aseguradora">${entry.aseguradora ? escapeHtml(entry.aseguradora) : ""}</div>
            <div class="aseguradoraText" data-placeholder="sin modelo">${entry.modelo ? escapeHtml(entry.modelo) : ""}</div>
          `;
          chip.addEventListener("click", (e)=>{
            if(e.target.closest("button")) return;
            openEditLocModal(zone.key, ci, pi);
          });
          chipsWrap.appendChild(chip);
        });
        const addBtn = document.createElement("button");
        addBtn.className = "addPlateToCampoBtn";
        addBtn.dataset.ci = ci;
        addBtn.textContent = "+ vehículo";
        chipsWrap.appendChild(addBtn);
        list.appendChild(card);
      });
    }

    // --- eventos: renombrar el número de campo ---
    list.querySelectorAll(".campoNum").forEach(span=>{
      span.addEventListener("click", ()=>{
        const ci = parseInt(span.getAttribute("data-ci"),10);
        const current = state.zones[zone.key][ci].campo;
        const input = prompt("Nuevo número/nombre de campo:", current);
        if(input === null) return;
        const newCampo = normalizeCampo(input);
        if(!newCampo || newCampo === current) return;

        const existing = state.zones[zone.key].find(c => c.campo === newCampo);
        const snap = snapshotZones();
        if(existing){
          if(!confirm(`Ya existe el campo ${newCampo} en esta zona con ${existing.plates.length} vehículo(s). ¿Fusionar los vehículos de ${current} ahí?`)) return;
          existing.plates.push(...state.zones[zone.key][ci].plates);
          state.zones[zone.key].splice(ci,1);
        } else {
          state.zones[zone.key][ci].campo = newCampo;
        }
        sortCampos(state.zones[zone.key]);
        pushUndo(snap);
        saveState();
        renderAll();
      });
    });

    // --- eventos: reordenar manualmente el orden de llegada ---
    function movePlate(zoneKey, ci, pi, dir){
      const plates = state.zones[zoneKey][ci].plates;
      const target = pi + dir;
      if(target < 0 || target >= plates.length) return;
      const snap = snapshotZones();
      [plates[pi], plates[target]] = [plates[target], plates[pi]];
      pushUndo(snap);
      saveState();
      renderAll();
    }
    list.querySelectorAll(".orderUp").forEach(b=>{
      b.addEventListener("click", (e)=>{
        const ci = parseInt(e.target.getAttribute("data-ci"),10);
        const pi = parseInt(e.target.getAttribute("data-pi"),10);
        movePlate(zone.key, ci, pi, -1);
      });
    });
    list.querySelectorAll(".orderDown").forEach(b=>{
      b.addEventListener("click", (e)=>{
        const ci = parseInt(e.target.getAttribute("data-ci"),10);
        const pi = parseInt(e.target.getAttribute("data-pi"),10);
        movePlate(zone.key, ci, pi, 1);
      });
    });

    // --- eventos: eliminar placa individual ---
    list.querySelectorAll(".chipRm").forEach(b=>{
      b.addEventListener("click", (e)=>{
        const ci = parseInt(e.target.getAttribute("data-ci"),10);
        const pi = parseInt(e.target.getAttribute("data-pi"),10);
        const snap = snapshotZones();
        removePlateAt(zone.key, ci, pi);
        pushUndo(snap);
        saveState();
        renderAll();
      });
    });

    // --- eventos: agregar vehículo a un campo existente ---
    list.querySelectorAll(".addPlateToCampoBtn").forEach(b=>{
      b.addEventListener("click", async ()=>{
        const ci = parseInt(b.getAttribute("data-ci"),10);
        const campoLabel = state.zones[zone.key][ci].campo;
        const plate = prompt(`Nueva placa para el campo ${campoLabel}:`);
        if(plate === null) return;
        const snap = snapshotZones();
        const ok = await addPlateToZone(zone.key, campoLabel, plate);
        if(ok){ pushUndo(snap); saveState(); renderAll(); }
      });
    });

    // --- eventos: eliminar campo completo ---
    list.querySelectorAll(".campoDeleteBtn").forEach(b=>{
      b.addEventListener("click", ()=>{
        const ci = parseInt(b.getAttribute("data-ci"),10);
        const c = state.zones[zone.key][ci];
        if(c.plates.length > 1 && !confirm(`El campo ${c.campo} tiene ${c.plates.length} vehículos. ¿Eliminar todo el campo?`)) return;
        const snap = snapshotZones();
        state.zones[zone.key].splice(ci,1);
        pushUndo(snap);
        saveState();
        renderAll();
      });
    });

    // --- agregar (fila superior) ---
    const campoInput = wrap.querySelector(`#campoInput_${info.abbr}`);
    const addInput = wrap.querySelector(`#addInput_${info.abbr}`);
    const aseguradoraInput = wrap.querySelector(`#aseguradoraInput_${info.abbr}`);
    const modeloInput = wrap.querySelector(`#modeloInput_${info.abbr}`);
    const addBtn = wrap.querySelector(`#addBtn_${info.abbr}`);
    const dupWarn = wrap.querySelector(`#dupWarn_${info.abbr}`);
    const similarWarn = wrap.querySelector(`#similarWarn_${info.abbr}`);
    const sinAsignarBtn = wrap.querySelector(`#sinAsignarBtn_${info.abbr}`);
    if(sinAsignarBtn){
      sinAsignarBtn.addEventListener("click", ()=>{
        campoInput.value = SIN_ASIGNAR;
        addInput.focus();
      });
    }

    function checkLiveDup(){
      const v = normalizePlate(addInput.value);
      if(!v){ dupWarn.style.display = "none"; similarWarn.style.display = "none"; return; }
      const dup = findPlate(v);
      if(dup){
        const dupInfo = zoneInfo(dup.zoneKey);
        const dupCampo = state.zones[dup.zoneKey][dup.campoIdx].campo;
        const mismaZona = dup.zoneKey === zone.key;
        dupWarn.innerHTML = `<span class="dupWarnIcon">⚠️</span> ${v} ya está registrada en ${mismaZona ? "esta zona" : dupInfo.label}, campo ${dupCampo}`;
        dupWarn.style.display = "flex";
        similarWarn.style.display = "none";
      } else {
        dupWarn.style.display = "none";
        const similares = findSimilarPlates(v);
        if(similares.length > 0){
          const items = similares.map(s=>{
            const zi = zoneInfo(s.zoneKey);
            const campo = state.zones[s.zoneKey][s.campoIdx].campo;
            return `<button type="button" class="useSimilarBtn" data-plate="${escapeAttrLike(s.plate)}">${s.plate}</button> (${zi.label}, campo ${campo})`;
          }).join(", ");
          similarWarn.innerHTML = `<span class="dupWarnIcon">🔍</span><span class="similarList">¿Es alguna de estas? ${items}</span>`;
          similarWarn.style.display = "flex";
          similarWarn.querySelectorAll(".useSimilarBtn").forEach(b=>{
            b.addEventListener("click", ()=>{
              addInput.value = b.getAttribute("data-plate");
              checkLiveDup();
              addInput.focus();
            });
          });
        } else {
          similarWarn.style.display = "none";
        }
      }
    }
    addInput.addEventListener("input", checkLiveDup);
    addInput.addEventListener("keyup", checkLiveDup);

    async function doAdd(){
      const plate = addInput.value;
      if(!normalizePlate(plate)) return;
      const snap = snapshotZones();
      const ok = await addPlateToZone(zone.key, campoInput.value, plate, aseguradoraInput.value, modeloInput.value);
      if(ok){
        pushUndo(snap);
        campoInput.value = "";
        addInput.value = "";
        aseguradoraInput.value = "";
        modeloInput.value = "";
        dupWarn.style.display = "none";
        saveState();
        renderAll();
      }
    }
    addBtn.addEventListener("click", doAdd);
    addInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") doAdd(); });
    campoInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") addInput.focus(); });
    aseguradoraInput.addEventListener("keydown", (e)=>{ if(e.key==="Enter") doAdd(); });

    // --- pegado masivo ---
    const bulkBtn = wrap.querySelector(`#bulkBtn_${info.abbr}`);
    const bulkArea = wrap.querySelector(`#bulkArea_${info.abbr}`);
    bulkBtn.addEventListener("click", async ()=>{
      const lines = bulkArea.value.split("\n").map(l=>l.trim()).filter(Boolean);
      if(lines.length===0) return;
      const snap = snapshotZones();
      let added = 0, skipped = 0;
      for(const line of lines){
        const parts = line.split(/\s+/);
        let campoLabel = null, plate;
        if(parts.length >= 2 && /^[0-9A-Za-z\-]+$/.test(parts[0]) && !isNaN(parseFloat(parts[0]))){
          campoLabel = parts[0];
          plate = parts.slice(1).join(" ");
        } else {
          plate = line;
        }
        const ok = await addPlateToZone(zone.key, campoLabel, plate);
        if(ok) added++; else skipped++;
      }
      if(added > 0) pushUndo(snap);
      bulkArea.value = "";
      saveState();
      renderAll();
      showToast(skipped===0 ? `${added} placa(s) agregada(s)` : `${added} agregada(s), ${skipped} omitida(s) (duplicadas o canceladas)`, 3200);
    });

    return wrap;
  }

  function buildResumenRows(){
    const rows = [];
    ZONES.forEach(z=>{
      (state.zones[z.key]||[]).forEach((c, ci)=>{
        c.plates.forEach((entry, pi)=>{
          rows.push({ zoneKey: z.key, zoneLabel: z.label, color: z.color, campo: c.campo, placa: entry.plate, aseguradora: entry.aseguradora || "", modelo: entry.modelo || "", lastUpdated: entry.lastUpdated, ci, pi });
        });
      });
    });
    return rows;
  }

  function renderResumenPanel(){
    const wrap = document.createElement("div");
    wrap.className = "zonePanel active";

    const chips = ZONES.map(z=>{
      const camposCount = occupancyCountForZone(z.key);
      const vehCount = (state.zones[z.key]||[]).reduce((a,cc)=>a+cc.plates.length,0);
      const cap = state.capacities[z.key];
      const occ = (cap && cap > 0) ? ` · ${camposCount}/${cap} campos` : ``;
      return `<div class="chip"><span class="dot" style="background:${z.color}"></span>${z.label}: ${vehCount} veh${occ}</div>`;
    }).join("");

    wrap.innerHTML = `
      <div class="zoneChips">${chips}</div>
      <div class="resumenToolbar">
        <div class="filterField">
          <svg class="filterIcon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="9" r="6"/><line x1="13.5" y1="13.5" x2="18" y2="18"/></svg>
          <input type="text" id="resumenFilter" placeholder="Buscar por placa o campo…" class="plate" autocomplete="off">
        </div>
        <div class="filterField selectField">
          <select id="resumenZoneFilter">
            <option value="">Todas las zonas</option>
            ${ZONES.map(z=>`<option value="${z.key}">${z.label}</option>`).join("")}
          </select>
        </div>
        <button class="clearFilterBtn" id="resumenClear" style="display:none;">Limpiar filtros</button>
      </div>
      <div class="resultsCount" id="resultsCount"></div>
      <table>
        <thead><tr><th style="width:70px;">Campo</th><th>Placa</th><th>Zona</th><th>Aseguradora</th><th>Modelo</th></tr></thead>
        <tbody id="resumenTbody"></tbody>
      </table>
      <div id="resumenEmpty"></div>
    `;
    document.getElementById("mainArea").appendChild(wrap);

    if(pendingResumenFilter){
      wrap.querySelector("#resumenFilter").value = pendingResumenFilter;
      pendingResumenFilter = "";
    }

    const filterInput = wrap.querySelector("#resumenFilter");
    const zoneSelect = wrap.querySelector("#resumenZoneFilter");
    const clearBtn = wrap.querySelector("#resumenClear");

    function draw(){
      const filterText = filterInput.value.trim().toUpperCase();
      const filterZone = zoneSelect.value;
      clearBtn.style.display = (filterText || filterZone) ? "inline-block" : "none";

      let rows = buildResumenRows();
      const totalCount = rows.length;
      if(filterZone) rows = rows.filter(r=>r.zoneKey===filterZone);
      if(filterText) rows = rows.filter(r=> r.placa.toUpperCase().includes(filterText) || String(r.campo).toUpperCase().includes(filterText) || (r.aseguradora||"").toUpperCase().includes(filterText) || (r.modelo||"").toUpperCase().includes(filterText));

      const countEl = wrap.querySelector("#resultsCount");
      countEl.textContent = (filterText || filterZone)
        ? `${rows.length} de ${totalCount} vehículo(s)`
        : `${totalCount} vehículo(s) en total`;

      const tbody = wrap.querySelector("#resumenTbody");
      tbody.innerHTML = "";
      if(rows.length===0){
        wrap.querySelector("#resumenEmpty").innerHTML = `<div class="emptyState">No hay resultados.</div>`;
      } else {
        wrap.querySelector("#resumenEmpty").innerHTML = "";
        rows.forEach(r=>{
          const tr = document.createElement("tr");
          tr.className = "resumenRow" + (wasUpdatedToday(r) ? " updatedToday" : "");
          tr.dataset.zone = r.zoneKey;
          tr.dataset.ci = r.ci;
          tr.dataset.pi = r.pi;
          tr.innerHTML = `
            <td><span class="spotNum${r.campo===SIN_ASIGNAR?" sinAsignar":""}" style="background:${r.color}">${escapeHtml(r.campo)}</span></td>
            <td class="plate">${escapeHtml(r.placa)} ${wasUpdatedToday(r) ? '<span class="updatedTodayTag" title="Se actualizó hoy">✓ hoy</span>' : ''}</td>
            <td>${r.zoneLabel}</td>
            <td>${r.aseguradora ? escapeHtml(r.aseguradora) : '<span style="color:var(--muted);">—</span>'}</td>
            <td>${r.modelo ? escapeHtml(r.modelo) : '<span style="color:var(--muted);">—</span>'}</td>
          `;
          tr.addEventListener("click", ()=>{
            if(currentUser && currentUser.role === "consulta"){
              openViewDetailModal(r.zoneKey, r.ci, r.pi);
            } else {
              openEditLocModal(r.zoneKey, r.ci, r.pi);
            }
          });
          tbody.appendChild(tr);
        });
      }
    }
    filterInput.addEventListener("input", draw);
    filterInput.addEventListener("keyup", draw);
    filterInput.addEventListener("change", draw);
    zoneSelect.addEventListener("change", draw);
    clearBtn.addEventListener("click", ()=>{
      filterInput.value = "";
      zoneSelect.value = "";
      draw();
      filterInput.focus();
    });
    draw();
  }

  function renderDashboardPanel(){
    const wrap = document.createElement("div");
    wrap.className = "zonePanel active";

    const totalVeh = ZONES.reduce((a,z)=> a + (state.zones[z.key]||[]).reduce((aa,c)=>aa+c.plates.length,0), 0);
    const totalCampos = ZONES.reduce((a,z)=> a + occupancyCountForZone(z.key), 0);
    const totalSinAsignar = ZONES.reduce((a,z)=>{
      const c = (state.zones[z.key]||[]).find(c=>c.campo===SIN_ASIGNAR);
      return a + (c ? c.plates.length : 0);
    }, 0);
    const zonasConCapacidad = ZONES.filter(z => state.capacities[z.key] && state.capacities[z.key] > 0).length;

    wrap.innerHTML = `
      <div class="dashboardGrid">
        <div class="dashCard"><div class="dashCardValue">${totalVeh}</div><div class="dashCardLabel">Vehículos totales</div></div>
        <div class="dashCard"><div class="dashCardValue">${totalCampos}</div><div class="dashCardLabel">Campos numerados en uso</div></div>
        <div class="dashCard"><div class="dashCardValue">${totalSinAsignar}</div><div class="dashCardLabel">Sin asignar</div></div>
        <div class="dashCard"><div class="dashCardValue">${zonasConCapacidad}/${ZONES.length}</div><div class="dashCardLabel">Zonas con capacidad definida</div></div>
      </div>
      <div class="chartCard">
        <h3>Vehículos por zona</h3>
        <div class="chartCanvasWrap"><canvas id="chartVehiclesByZone"></canvas></div>
      </div>
      <div class="chartCard">
        <h3>Ocupación vs. capacidad</h3>
        <div id="occupancyChartHolder"></div>
      </div>
      ${canEdit() ? `
      <div class="chartCard">
        <h3>Capacidad por zona</h3>
        <div class="capacityByZoneList">
          ${ZONES.map(z=>{

                <span class="capacityByZoneName">${z.label}</span>

          const trimmed = input.trim();
          if(trimmed === ""){
            delete state.capacities[zoneKey];
          } else {
            const n = parseInt(trimmed, 10);
            if(isNaN(n) || n <= 0){ showToast("Ingresá un número válido"); return; }

          }
          saveState();
          renderAll();
        });

      wrap.querySelector(".chartCanvasWrap").innerHTML = `<div class="dashEmptyNote">No se pudo cargar el gráfico (revisá tu conexión a internet).</div>`;
    }

    // ---- Gráfico 2: ocupación vs capacidad (solo zonas con capacidad definida) ----
    const zonasConCap = ZONES.filter(z => state.capacities[z.key] && state.capacities[z.key] > 0);
    const holder = wrap.querySelector("#occupancyChartHolder");
    if(zonasConCap.length === 0){
      holder.innerHTML = `<div class="dashEmptyNote">Todavía no definiste capacidad en ninguna zona. Entrá a una zona y tocá "definir capacidad" para ver aquí el porcentaje de ocupación.</div>`;
    } else {
      try{
        if(typeof Chart === "undefined") throw new Error("Chart.js no está disponible");
        holder.innerHTML = `<div class="chartCanvasWrap"><canvas id="chartOccupancy"></canvas></div>`;

            labels: zonasConCap.map(z=>z.label),

                backgroundColor: zonasConCap.map(z=>"#"+z.hex),
                borderRadius: 5,

              },

                label: "Capacidad",

  // ---- Global search ----
  const searchInput = document.getElementById("globalSearch");
  const searchResults = document.getElementById("searchResults");

  function runSearch(q){
    q = q.trim().toUpperCase();
    if(!q){ searchResults.classList.remove("show"); searchResults.innerHTML=""; return; }
    const rows = buildResumenRows().filter(r=>r.placa.toUpperCase().includes(q));
    if(rows.length===0){
      searchResults.innerHTML = `<div class="searchItem" style="cursor:default;">Sin coincidencias</div>`;
    } else {
      searchResults.innerHTML = rows.slice(0,25).map(r=>`
        <div class="searchItem" data-zone="${r.zoneKey}">
          <span class="plate">${escapeHtml(r.placa)}</span>
          <span class="tag">${r.zoneLabel} · campo ${escapeHtml(r.campo)}</span>
        </div>
      `).join("");
      searchResults.querySelectorAll(".searchItem").forEach(el=>{
        el.addEventListener("click", ()=>{
          const zone = el.getAttribute("data-zone");
          const placaTexto = el.querySelector(".plate") ? el.querySelector(".plate").textContent : "";
          pendingResumenFilter = placaTexto;
          activeTab = "__resumen__";
          searchInput.value = "";
          searchResults.classList.remove("show");
          renderAll();
        });
      });
    }
    searchResults.classList.add("show");
  }
  searchInput.addEventListener("input", (e)=> runSearch(e.target.value));
  searchInput.addEventListener("keyup", (e)=> runSearch(e.target.value));
  searchInput.addEventListener("blur", ()=> setTimeout(()=>searchResults.classList.remove("show"), 150));
  searchInput.addEventListener("focus", (e)=> { if(e.target.value) runSearch(e.target.value); });
  searchInput.addEventListener("keydown", (e)=>{
    if(e.key === "Enter"){
      e.preventDefault();
      const q = searchInput.value.trim();
      if(!q) return;
      pendingResumenFilter = q;
      activeTab = "__resumen__";
      searchInput.value = "";
      searchResults.classList.remove("show");
      renderAll();
    }
  });

  // ---- Export ----
  // ---- Respaldo completo (JSON): exportar todo el estado y poder restaurarlo ----
  document.getElementById("backupBtn").addEventListener("click", ()=>{
    if(!guardEdit()) return;
    const payload = {
      tipo: "respaldo-inventario-parqueo",
      version: 1,
      exportadoEn: new Date().toISOString(),
      zones: state.zones,
      capacities: state.capacities
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const fecha = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `Respaldo_Inventario_Parqueo_${fecha}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

  });

  document.getElementById("restoreBtn").addEventListener("click", ()=>{
    if(!guardEdit()) return;
    document.getElementById("restoreFileInput").click();
  });

  document.getElementById("restoreFileInput").addEventListener("change", (e)=>{
    if(!guardEdit()) return;
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // permitir volver a elegir el mismo archivo después
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      let payload;
      try{
        payload = JSON.parse(reader.result);
      }catch(err){
        showToast("Ese archivo no es un respaldo válido (JSON inválido)");
        return;
      }
      if(!payload || typeof payload.zones !== "object"){
        showToast("Ese archivo no tiene el formato esperado de un respaldo");
        return;
      }
      if(!confirm("Esto reemplaza TODO el inventario actual por el contenido del respaldo. ¿Continuar?")) return;
      const snap = snapshotZones();
      state.zones = payload.zones;
      state.capacities = payload.capacities || {};
      pushUndo(snap);
      await saveState();
      renderAll();
      showToast("Respaldo restaurado correctamente");
    };
    reader.onerror = ()=> showToast("No se pudo leer el archivo");
    reader.readAsText(file);
  });

  document.getElementById("exportBtn").addEventListener("click", ()=>{

    const wb = XLSX.utils.book_new();
